note": "exit code 1", "output": "error: getting status of \"/private/tmp/doctest-test-dequ0xqd/doctests/custodian-probe\": No such file or directory\n", "status": "fail"}], "md": "### 2.4 Build the custodian fixture\n\nAccount mutation is gated on a configured **custodian**. In production that is\n`keystore_ui`; here it is a small fixture module, so the gate can be exercised\nfrom both sides headlessly. A fixture is a real caller with a real name \u2014 the\ngate does not care what a module is *for*.\n\n```bash\nnix build ./doctests/custodian-probe#lgx-portable -o custodian-lgx\n```"}, {"execs": [{"cmd": "./lgpm/bin/lgpm --modules-dir ./modules --allow-unsigned install --file custodian-lgx/*.lgx", "exit_code": 1, "kind": "run", "note": "exit code 1", "output": "Installing from file: custodian-lgx/*.lgx... FAILED\nError: Source plugin file does not exist or is not a file: custodian-lgx/*.lgx\n", "status": "fail"}], "md": "### 2.5 Install both\n\n```bash\n./lgpm/bin/lgpm --modules-dir ./modules --allow-unsigned install --file custodian-lgx/*.lgx\n```"}, {"execs": [{"cmd": "./lgpm/bin/lgpm --modules-dir ./modules list", "exit_code": 0, "kind": "run", "note": "expected 'keystore_custodian' not found in output", "output": "Found 3 installed module(s):\n\nNAME                           VERSION         TYPE       CATEGORY       \n----------------------------------------------------------------------\ncapability_module              1.0.0           core       security       \nkeystore_module                1.0.0           core       wallet         \nmodules_state                  0.1.0           core       system         \n", "status": "fail"}], "md": "### 2.6 Confirm the install\n\n```bash\n./lgpm/bin/lgpm --modules-dir ./modules list\n```"}, {"execs": [], "md": "## Step 3: Run the daemon and drive the keystore\n\nStart `logoscore` pointed at `./modules`, load the module, and call it. We\nuse Foundry's well-known test key (account 0,\n`0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266`). Note that `logoscore`'s `call`\nauto-types a `0x\u2026` argument as a number, so addresses are passed as **bare\nhex** \u2014 the keystore accepts either form."}, {"execs": [{"cmd": "sh -c './logos/bin/logoscore -D -m ./modules > logs.txt 2>&1 &'", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "### 3.1 Start the daemon once, so the module data directory exists\n\n```bash\nlogoscore -D -m ./modules > logs.txt &\n```"}, {"execs": [{"cmd": "sleep 3", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "```bash\nsleep 3\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore load-module keystore_module", "exit_code": 0, "kind": "run", "note": "", "output": "{\"dependencies_loaded\":[],\"module\":\"keystore_module\",\"status\":\"ok\",\"version\":\"1.0.0\"}\n", "status": "pass"}], "md": "### 3.2 Load the module\n\n```bash\n./logos/bin/logoscore load-module keystore_module\n```"}, {"execs": [{"cmd": "sleep 1 && ./logos/bin/logoscore stop || true", "exit_code": 0, "kind": "run", "note": "", "output": "{\"message\":\"Daemon shutting down.\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "```bash\nsleep 1 && ./logos/bin/logoscore stop || true\n```"}, {"execs": [{"cmd": "d=$(find . -type d -path '*module_data/keystore_module/*' | head -1)\nmkdir -p \"$d\"\nprintf '{\"approver\":\"signer_ui\",\"custodian\":\"keystore_custodian\"}\\n' > \"$d/keystore.json\"\ncat \"$d/keystore.json\"\n", "exit_code": 1, "kind": "run", "note": "exit code 1", "output": "mkdir: : No such file or directory\n/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 3: /keystore.json: Read-only file system\ncat: /keystore.json: No such file or directory\n", "status": "fail"}], "md": "### 3.3 Name the custodian\n\nWho may mutate the keystore is **configuration, not a method**: a `set_custodian`\ncall would be a remotely-writable answer to \"who may import a key\". The file is\nwritten by whoever deploys the module, and the module reads it once at startup.\n\nThe path is instance-hashed, hence the glob.\n\n```bash\necho '{\"custodian\":\"keystore_custodian\"}' > <module-data>/keystore.json\n```"}, {"execs": [{"cmd": "sh -c './logos/bin/logoscore -D -m ./modules > logs.txt 2>&1 &'", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "### 3.4 Restart with the custodian configured\n\n```bash\nsh -c './logos/bin/logoscore -D -m ./modules > logs.txt 2>&1 &'\n```"}, {"execs": [{"cmd": "sleep 3", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "```bash\nsleep 3\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore load-module keystore_module", "exit_code": 2, "kind": "run", "note": "exit code 2", "output": "{\"code\":\"NO_DAEMON\",\"message\":\"No daemon running (no local endpoint at /var/folders/df/djsxfhc17x95674wsm_g8s980000gn/T/logos_core_service_dc274d2185c0). A daemon that stopped removes it; start one in this session to get it back.\",\"status\":\"error\"}\n", "status": "fail"}], "md": "### 3.5 Load the module\n\n```bash\nlogoscore load-module keystore_module\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore module-info keystore_module", "exit_code": 2, "kind": "run", "note": "exit code 2", "output": "{\"code\":\"NO_DAEMON\",\"message\":\"No daemon running (no local endpoint at /var/folders/df/djsxfhc17x95674wsm_g8s980000gn/T/logos_core_service_dc274d2185c0). A daemon that stopped removes it; start one in this session to get it back.\",\"status\":\"error\"}\n", "status": "fail"}], "md": "### 3.6 Introspect the module\n\n```bash\nlogoscore module-info keystore_module\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore load-module keystore_custodian", "exit_code": 2, "kind": "run", "note": "exit code 2", "output": "{\"code\":\"NO_DAEMON\",\"message\":\"No daemon running (no local endpoint at /var/folders/df/djsxfhc17x95674wsm_g8s980000gn/T/logos_core_service_dc274d2185c0). A daemon that stopped removes it; start one in this session to get it back.\",\"status\":\"error\"}\n", "status": "fail"}], "md": "### 3.7 Load the custodian fixture\n\n```bash\n./logos/bin/logoscore load-module keystore_custodian\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore call keystore_module create_mnemonic 12\n./logos/bin/logoscore call keystore_module import_private_key ac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80 pw\n", "exit_code": 2, "kind": "run", "note": "exit code 2", "output": "{\"code\":\"NO_DAEMON\",\"message\":\"No daemon running (no local endpoint at /var/folders/df/djsxfhc17x95674wsm_g8s980000gn/T/logos_core_service_dc274d2185c0). A daemon that stopped removes it; start one in this session to get it back.\",\"status\":\"error\"}\n{\"code\":\"NO_DAEMON\",\"message\":\"No daemon running (no local endpoint at /var/folders/df/djsxfhc17x95674wsm_g8s980000gn/T/logos_core_service_dc274d2185c0). A daemon that stopped removes it; start one in this session to get it back.\",\"status\":\"error\"}\n", "status": "fail"}], "md": "### 3.8 The CLI cannot mutate the keystore\n\nThe CLI authenticates as the **host anchor** \u2014 one undifferentiated bag covering\nthe shells and every relayed token. Admitting it would make `logoscore call` a\nlegal way to import a key, so Tier D refuses it. The refusal string is identical\nto Tier A's and Tier B's, so a caller cannot use the error text to work out which\ntier it failed.\n\n```bash\nlogoscore call keystore_module import_private_key <privkey> pw\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore call keystore_module derive_next_account '{\"groupPassword\":\"gp\",\"password\":\"pw\"}'", "exit_code": 2, "kind": "run", "note": "exit code 2", "output": "{\"code\":\"NO_DAEMON\",\"message\":\"No daemon running (no local endpoint at /var/folders/df/djsxfhc17x95674wsm_g8s980000gn/T/logos_core_service_dc274d2185c0). A daemon that stopped removes it; start one in this session to get it back.\",\"status\":\"error\"}\n", "status": "fail"}], "md": "### 3.9 \u2026and it cannot derive an account either\n\nHD derivation is account mutation, so it sits behind the same gate. It also opens a\nvault whose blast radius is a whole wallet rather than one account \u2014 an `extkey`\ngroup's stored key reaches every address under one BIP-44 account, past and future.\nThe refusal is byte-identical to the one above.\n\n```bash\nlogoscore call keystore_module derive_next_account '{\"groupPassword\":\"gp\",\"password\":\"pw\"}'\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore call keystore_module list_accounts", "exit_code": 2, "kind": "run", "note": "exit code 2", "output": "{\"code\":\"NO_DAEMON\",\"message\":\"No daemon running (no local endpoint at /var/folders/df/djsxfhc17x95674wsm_g8s980000gn/T/logos_core_service_dc274d2185c0). A daemon that stopped removes it; start one in this session to get it back.\",\"status\":\"error\"}\n", "status": "fail"}], "md": "### 3.10 \u2026but the ungated reads still work\n\nThe gate closed account *mutation*, not the module. A wallet must still be able to\nshow which accounts exist \u2014 that is exactly the line Tier D draws.\n\n```bash\nlogoscore call keystore_module list_accounts\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore call keystore_custodian identity", "exit_code": 2, "kind": "run", "note": "exit code 2", "output": "{\"code\":\"NO_DAEMON\",\"message\":\"No daemon running (no local endpoint at /var/folders/df/djsxfhc17x95674wsm_g8s980000gn/T/logos_core_service_dc274d2185c0). A daemon that stopped removes it; start one in this session to get it back.\",\"status\":\"error\"}\n", "status": "fail"}], "md": "### 3.11 Generate a BIP-39 mnemonic, through the custodian\n\n```bash\nlogoscore call keystore_custodian identity\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore call keystore_custodian import_key ac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80 pw", "exit_code": 2, "kind": "run", "note": "exit code 2", "output": "{\"code\":\"NO_DAEMON\",\"message\":\"No daemon running (no local endpoint at /var/folders/df/djsxfhc17x95674wsm_g8s980000gn/T/logos_core_service_dc274d2185c0). A daemon that stopped removes it; start one in this session to get it back.\",\"status\":\"error\"}\n", "status": "fail"}], "md": "### 3.12 Import a known private key\n\nImport Foundry's account-0 private key under a passphrase. The module\nreturns only the **address** \u2014 the key stays inside the scrypt vault.\n\n```bash\nlogoscore call keystore_custodian import_key <privkey> pw\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore call keystore_module list_accounts", "exit_code": 2, "kind": "run", "note": "exit code 2", "output": "{\"code\":\"NO_DAEMON\",\"message\":\"No daemon running (no local endpoint at /var/folders/df/djsxfhc17x95674wsm_g8s980000gn/T/logos_core_service_dc274d2185c0). A daemon that stopped removes it; start one in this session to get it back.\",\"status\":\"error\"}\n", "status": "fail"}], "md": "### 3.13 List accounts\n\n```bash\nlogoscore call keystore_module list_accounts\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore call keystore_custodian create pw false", "exit_code": 2, "kind": "run", "note": "exit code 2", "output": "{\"code\":\"NO_DAEMON\",\"message\":\"No daemon running (no local endpoint at /var/folders/df/djsxfhc17x95674wsm_g8s980000gn/T/logos_core_service_dc274d2185c0). A daemon that stopped removes it; start one in this session to get it back.\",\"status\":\"error\"}\n", "status": "fail"}], "md": "### 3.14 A key no recovery phrase covers needs an acknowledgement\n\n`create_unrelated_account` is the **one** way to obtain a key generated from\nrandomness rather than derived from a phrase. There used to be a second,\n`new_account`, which minted one silently on a keystore that looked empty \u2014 whether\nthat was safe rested on a directory scan being complete, and \"is there live key\nmaterial anywhere under this store\" is not decidable by inspection.\n\nThe acknowledgement is. Note who is refused here: the **custodian**, the one caller\nTier D admits. The acknowledgement is a property of the call, not of the caller, so\nthere is no identity that skips it.\n\n```bash\nlogoscore call keystore_custodian create pw false\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore call keystore_custodian create pw true", "exit_code": 2, "kind": "run", "note": "exit code 2", "output": "{\"code\":\"NO_DAEMON\",\"message\":\"No daemon running (no local endpoint at /var/folders/df/djsxfhc17x95674wsm_g8s980000gn/T/logos_core_service_dc274d2185c0). A daemon that stopped removes it; start one in this session to get it back.\",\"status\":\"error\"}\n", "status": "fail"}], "md": "### 3.15 \u2026and with it, the key lands\n\nSame caller, same password, one argument different. The refusal above is not a\nrate limit or a retry \u2014 the key does not exist until it is acknowledged.\n\n```bash\nlogoscore call keystore_custodian create pw true\n```"}, {"execs": [{"cmd": "d=$(find . -type d -path '*module_data/keystore_module/*' | head -1)\nprintf 'x' > \"$d/keystore/.DS_Store\"\n./logos/bin/logoscore call keystore_module list_accounts\n./logos/bin/logoscore call keystore_custodian create pw true\n./logos/bin/logoscore call keystore_custodian settle\n./logos/bin/logoscore call keystore_custodian remove .DS_Store\n", "exit_code": 2, "kind": "run", "note": "exit code 2", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 2: /keystore/.DS_Store: No such file or directory\n{\"code\":\"NO_DAEMON\",\"message\":\"No daemon running (no local endpoint at /var/folders/df/djsxfhc17x95674wsm_g8s980000gn/T/logos_core_service_dc274d2185c0). A daemon that stopped removes it; start one in this session to get it back.\",\"status\":\"error\"}\n{\"code\":\"NO_DAEMON\",\"message\":\"No daemon running (no local endpoint at /var/folders/df/djsxfhc17x95674wsm_g8s980000gn/T/logos_core_service_dc274d2185c0). A daemon that stopped removes it; start one in this session to get it back.\",\"status\":\"error\"}\n{\"code\":\"NO_DAEMON\",\"message\":\"No daemon running (no local endpoint at /var/folders/df/djsxfhc17x95674wsm_g8s980000gn/T/logos_core_service_dc274d2185c0). A daemon that stopped removes it; start one in this session to get it back.\",\"status\":\"error\"}\n{\"code\":\"NO_DAEMON\",\"message\":\"No daemon running (no local endpoint at /var/folders/df/djsxfhc17x95674wsm_g8s980000gn/T/logos_core_service_dc274d2185c0). A daemon that stopped removes it; start one in this session to get it back.\",\"status\":\"error\"}\n", "status": "fail"}], "md": "### 3.16 A file the keystore did not write is reported, not a wedge\n\nDrop a `.DS_Store` into the keystore directory. The scan cannot explain it, and it\nsays so \u2014 but it no longer refuses anything: listing, creating and sweeping all\nkeep working, and the reported path is removable by name. When the scan was the\nsafety gate this was a brick, because anything it could not name might have been a\nhidden derivation key.\n\n```bash\necho x > <module-data>/keystore/.DS_Store\nlogoscore call keystore_module list_accounts\nlogoscore call keystore_custodian remove .DS_Store\n```"}, {"execs": [{"cmd": "r=$(./logos/bin/logoscore call keystore_custodian import_phrase 'abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about' gp pw2 0)\ng=$(echo \"$r\" | grep -o 'g_[0-9a-f]\\{32\\}' | head -1)\na=$(echo \"$r\" | grep -o '0x[0-9a-fA-F]\\{40\\}' | head -1); a=${a#0x}\n./logos/bin/logoscore call keystore_module set_group_label \"{\\\"group\\\":\\\"$g\\\",\\\"label\\\":\\\"Cold storage\\\"}\"\n./logos/bin/logoscore call keystore_custodian name_wallet \"$g\" \"Cold storage\" \"$a\" wrong-password\n./logos/bin/logoscore call keystore_custodian name_wallet \"$g\" \"Cold storage\" \"\" \"\"\n./logos/bin/logoscore call keystore_custodian name_wallet \"$g\" \"Cold storage\" \"$a\" pw2\n./logos/bin/logoscore call keystore_module get_group_labels\n", "exit_code": 2, "kind": "run", "note": "exit code 2", "output": "{\"code\":\"NO_DAEMON\",\"message\":\"No daemon running (no local endpoint at /var/folders/df/djsxfhc17x95674wsm_g8s980000gn/T/logos_core_service_dc274d2185c0). A daemon that stopped removes it; start one in this session to get it back.\",\"status\":\"error\"}\n{\"code\":\"NO_DAEMON\",\"message\":\"No daemon running (no local endpoint at /var/folders/df/djsxfhc17x95674wsm_g8s980000gn/T/logos_core_service_dc274d2185c0). A daemon that stopped removes it; start one in this session to get it back.\",\"status\":\"error\"}\n{\"code\":\"NO_DAEMON\",\"message\":\"No daemon running (no local endpoint at /var/folders/df/djsxfhc17x95674wsm_g8s980000gn/T/logos_core_service_dc274d2185c0). A daemon that stopped removes it; start one in this session to get it back.\",\"status\":\"error\"}\n{\"code\":\"NO_DAEMON\",\"message\":\"No daemon running (no local endpoint at /var/folders/df/djsxfhc17x95674wsm_g8s980000gn/T/logos_core_service_dc274d2185c0). A daemon that stopped removes it; start one in this session to get it back.\",\"status\":\"error\"}\n{\"code\":\"NO_DAEMON\",\"message\":\"No daemon running (no local endpoint at /var/folders/df/djsxfhc17x95674wsm_g8s980000gn/T/logos_core_service_dc274d2185c0). A daemon that stopped removes it; start one in this session to get it back.\",\"status\":\"error\"}\n", "status": "fail"}], "md": "### 3.17 Name a wallet \u2014 and prove you hold one of its accounts\n\nA derivation group has no name of its own to fall back on: what a UI shows is its\nfirst account's address, and deleting that account moves it. `set_group_label`\ngives it one. It is Tier D, so the CLI is refused and the custodian is not.\n\nTier D is not the whole story here. A name is the one string in this keystore that\nan attacker chooses and a human reads \u2014 it is rendered *in place of* an address \u2014\nso setting one now also needs the vault password of **one of the wallet's own\naccounts**. Holding an account is precisely the claim \"this wallet is mine\". The\n*group* password is not accepted here: it proves you can make accounts, not that\nyou own the ones the header speaks for. Where the wallet has **no** accounts and\nonly a key, it is the credential \u2014 see the next step.\n\n`get_group_labels` is **ungated**, and answers from its own document rather than\nfrom the group record \u2014 so the name outlives the record and the key it belonged to,\nwhich is exactly the row a UI has to name while asking whether to delete it. Two\nwallets may carry one name: telling them apart is the reader's job, and refusing\nthe write would only stop it showing what the user actually did.\n\n```bash\nlogoscore call keystore_module set_group_label '{\"group\":\"<g>\",\"label\":\"Cold storage\"}'   # refused: Tier D\nlogoscore call keystore_custodian name_wallet <g> \"Cold storage\" <address> wrong-password # refused: password\nlogoscore call keystore_custodian name_wallet <g> \"Cold storage\" \"\" \"\"                    # refused: no account named\nlogoscore call keystore_custodian name_wallet <g> \"Cold storage\" <address> pw2            # written\nlogoscore call keystore_module get_group_labels\n```"}, {"execs": [{"cmd": "r=$(./logos/bin/logoscore call keystore_custodian import_phrase 'abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about' gp4 pw4 5)\ng=$(echo \"$r\" | grep -o 'g_[0-9a-f]\\{32\\}' | head -1)\na=$(echo \"$r\" | grep -o '0x[0-9a-fA-F]\\{40\\}' | head -1); a=${a#0x}\n./logos/bin/logoscore call keystore_custodian delete \"$a\" pw4\n./logos/bin/logoscore call keystore_custodian name_wallet \"$g\" \"Cold storage\" \"\" \"\"\n./logos/bin/logoscore call keystore_custodian name_wallet \"$g\" \"Cold storage\" \"\" wrong-password\n./logos/bin/logoscore call keystore_custodian name_wallet \"$g\" \"Cold storage\" \"\" gp4\n./logos/bin/logoscore call keystore_custodian derive \"$g\" gp4 pw4\n./logos/bin/logoscore call keystore_module list_groups\n", "exit_code": 2, "kind": "run", "note": "exit code 2", "output": "{\"code\":\"NO_DAEMON\",\"message\":\"No daemon running (no local endpoint at /var/folders/df/djsxfhc17x95674wsm_g8s980000gn/T/logos_core_service_dc274d2185c0). A daemon that stopped removes it; start one in this session to get it back.\",\"status\":\"error\"}\n{\"code\":\"NO_DAEMON\",\"message\":\"No daemon running (no local endpoint at /var/folders/df/djsxfhc17x95674wsm_g8s980000gn/T/logos_core_service_dc274d2185c0). A daemon that stopped removes it; start one in this session to get it back.\",\"status\":\"error\"}\n{\"code\":\"NO_DAEMON\",\"message\":\"No daemon running (no local endpoint at /var/folders/df/djsxfhc17x95674wsm_g8s980000gn/T/logos_core_service_dc274d2185c0). A daemon that stopped removes it; start one in this session to get it back.\",\"status\":\"error\"}\n{\"code\":\"NO_DAEMON\",\"message\":\"No daemon running (no local endpoint at /var/folders/df/djsxfhc17x95674wsm_g8s980000gn/T/logos_core_service_dc274d2185c0). A daemon that stopped removes it; start one in this session to get it back.\",\"status\":\"error\"}\n{\"code\":\"NO_DAEMON\",\"message\":\"No daemon running (no local endpoint at /var/folders/df/djsxfhc17x95674wsm_g8s980000gn/T/logos_core_service_dc274d2185c0). A daemon that stopped removes it; start one in this session to get it back.\",\"status\":\"error\"}\n{\"code\":\"NO_DAEMON\",\"message\":\"No daemon running (no local endpoint at /var/folders/df/djsxfhc17x95674wsm_g8s980000gn/T/logos_core_service_dc274d2185c0). A daemon that stopped removes it; start one in this session to get it back.\",\"status\":\"error\"}\n", "status": "fail"}], "md": "### 3.18 A wallet that can still mint accounts is named by its derivation key\n\n\"No accounts\" is not \"holds nothing\". A wallet that keeps a derivation key and has\nno accounts *yet* will have them, and they will be shown under whatever name is on\nthe header \u2014 so a name written here with no proof comes to stand over a real\naccount the moment one is derived. The exemption is therefore for a wallet that\nholds **nothing**: no accounts *and* no key at either path, which is the same\nprecondition `remove_group` refuses on.\n\nWith a key and no accounts there is no account to hold, so what proves the name is\nthe thing that will mint them: the **derivation key's** own password. Clearing a\nname still asks for nothing, and `forget_derivation` still takes no password \u2014 a\nkey you cannot open stays deletable.\n\n```bash\nlogoscore call keystore_custodian delete <address> pw4          # the wallet now has no accounts\nlogoscore call keystore_custodian name_wallet <g> \"Cold storage\" \"\" \"\"              # refused: needs the key\nlogoscore call keystore_custodian name_wallet <g> \"Cold storage\" \"\" wrong-password  # refused: password\nlogoscore call keystore_custodian name_wallet <g> \"Cold storage\" \"\" gp4             # written\nlogoscore call keystore_custodian derive <g> gp4 pw4            # and now the name stands over an account\nlogoscore call keystore_module list_groups\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore call keystore_custodian name_account f39Fd6e51aad88F6F4ce6aB8827279cffFb92266 Treasury wrong-password\n./logos/bin/logoscore call keystore_module get_labels\n./logos/bin/logoscore call keystore_custodian name_account f39Fd6e51aad88F6F4ce6aB8827279cffFb92266 Treasury pw\n./logos/bin/logoscore call keystore_module get_labels\n./logos/bin/logoscore call keystore_custodian name_account f39Fd6e51aad88F6F4ce6aB8827279cffFb92266 \"  \" nonsense\n./logos/bin/logoscore call keystore_module get_labels\n", "exit_code": 2, "kind": "run", "note": "exit code 2", "output": "{\"code\":\"NO_DAEMON\",\"message\":\"No daemon running (no local endpoint at /var/folders/df/djsxfhc17x95674wsm_g8s980000gn/T/logos_core_service_dc274d2185c0). A daemon that stopped removes it; start one in this session to get it back.\",\"status\":\"error\"}\n{\"code\":\"NO_DAEMON\",\"message\":\"No daemon running (no local endpoint at /var/folders/df/djsxfhc17x95674wsm_g8s980000gn/T/logos_core_service_dc274d2185c0). A daemon that stopped removes it; start one in this session to get it back.\",\"status\":\"error\"}\n{\"code\":\"NO_DAEMON\",\"message\":\"No daemon running (no local endpoint at /var/folders/df/djsxfhc17x95674wsm_g8s980000gn/T/logos_core_service_dc274d2185c0). A daemon that stopped removes it; start one in this session to get it back.\",\"status\":\"error\"}\n{\"code\":\"NO_DAEMON\",\"message\":\"No daemon running (no local endpoint at /var/folders/df/djsxfhc17x95674wsm_g8s980000gn/T/logos_core_service_dc274d2185c0). A daemon that stopped removes it; start one in this session to get it back.\",\"status\":\"error\"}\n{\"code\":\"NO_DAEMON\",\"message\":\"No daemon running (no local endpoint at /var/folders/df/djsxfhc17x95674wsm_g8s980000gn/T/logos_core_service_dc274d2185c0). A daemon that stopped removes it; start one in this session to get it back.\",\"status\":\"error\"}\n{\"code\":\"NO_DAEMON\",\"message\":\"No daemon running (no local endpoint at /var/folders/df/djsxfhc17x95674wsm_g8s980000gn/T/logos_core_service_dc274d2185c0). A daemon that stopped removes it; start one in this session to get it back.\",\"status\":\"error\"}\n", "status": "fail"}], "md": "### 3.19 Naming an account proves you hold that account\n\nThe same rule, one level down, and this is the sharper case: `set_label` writes the\nstring a wallet renders *instead of* an address in its account picker. Renaming\n\"Savings\" to something a user would fund is exactly the attack, so setting a name\nneeds that account's own vault password.\n\n**Clearing a name needs nothing.** It can only move the display back toward the raw\naddress, which is ground truth \u2014 it cannot impersonate anyone \u2014 and it is the one\nway to strip a stale name off an account whose password is lost. Without that\nexemption we would rebuild the wedge `forget_derivation` exists to avoid: a thing\nyou cannot open and therefore cannot manage.\n\nThe account below is Foundry's account 0, imported near the top of this run under\nthe password `pw`.\n\n```bash\nlogoscore call keystore_custodian name_account <address> Treasury wrong-password  # refused\nlogoscore call keystore_custodian name_account <address> Treasury pw              # written\nlogoscore call keystore_custodian name_account <address> \"  \" nonsense            # cleared, no password\nlogoscore call keystore_module get_labels\n```"}, {"execs": [{"cmd": "r=$(./logos/bin/logoscore call keystore_custodian import_phrase 'abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about' gp2 pw3 1)\ng=$(echo \"$r\" | grep -o 'g_[0-9a-f]\\{32\\}' | head -1)\na=$(echo \"$r\" | grep -o '0x[0-9a-fA-F]\\{40\\}' | head -1); a=${a#0x}\n./logos/bin/logoscore call keystore_custodian name_wallet \"$g\" \"Old phone\" \"$a\" pw3\n./logos/bin/logoscore call keystore_module remove_group \"{\\\"group\\\":\\\"$g\\\"}\"\n./logos/bin/logoscore call keystore_custodian remove_wallet \"$g\"\n./logos/bin/logoscore call keystore_custodian forget \"$g\"\n./logos/bin/logoscore call keystore_custodian remove_wallet \"$g\"\n./logos/bin/logoscore call keystore_custodian delete \"$a\" pw3\n./logos/bin/logoscore call keystore_custodian remove_wallet \"$g\"\n./logos/bin/logoscore call keystore_module list_groups\n", "exit_code": 2, "kind": "run", "note": "exit code 2", "output": "{\"code\":\"NO_DAEMON\",\"message\":\"No daemon running (no local endpoint at /var/folders/df/djsxfhc17x95674wsm_g8s980000gn/T/logos_core_service_dc274d2185c0). A daemon that stopped removes it; start one in this session to get it back.\",\"status\":\"error\"}\n{\"code\":\"NO_DAEMON\",\"message\":\"No daemon running (no local endpoint at /var/folders/df/djsxfhc17x95674wsm_g8s980000gn/T/logos_core_service_dc274d2185c0). A daemon that stopped removes it; start one in this session to get it back.\",\"status\":\"error\"}\n{\"code\":\"NO_DAEMON\",\"message\":\"No daemon running (no local endpoint at /var/folders/df/djsxfhc17x95674wsm_g8s980000gn/T/logos_core_service_dc274d2185c0). A daemon that stopped removes it; start one in this session to get it back.\",\"status\":\"error\"}\n{\"code\":\"NO_DAEMON\",\"message\":\"No daemon running (no local endpoint at /var/folders/df/djsxfhc17x95674wsm_g8s980000gn/T/logos_core_service_dc274d2185c0). A daemon that stopped removes it; start one in this session to get it back.\",\"status\":\"error\"}\n{\"code\":\"NO_DAEMON\",\"message\":\"No daemon running (no local endpoint at /var/folders/df/djsxfhc17x95674wsm_g8s980000gn/T/logos_core_service_dc274d2185c0). A daemon that stopped removes it; start one in this session to get it back.\",\"status\":\"error\"}\n{\"code\":\"NO_DAEMON\",\"message\":\"No daemon running (no local endpoint at /var/folders/df/djsxfhc17x95674wsm_g8s980000gn/T/logos_core_service_dc274d2185c0). A daemon that stopped removes it; start one in this session to get it back.\",\"status\":\"error\"}\n{\"code\":\"NO_DAEMON\",\"message\":\"No daemon running (no local endpoint at /var/folders/df/djsxfhc17x95674wsm_g8s980000gn/T/logos_core_service_dc274d2185c0). A daemon that stopped removes it; start one in this session to get it back.\",\"status\":\"error\"}\n{\"code\":\"NO_DAEMON\",\"message\":\"No daemon running (no local endpoint at /var/folders/df/djsxfhc17x95674wsm_g8s980000gn/T/logos_core_service_dc274d2185c0). A daemon that stopped removes it; start one in this session to get it back.\",\"status\":\"error\"}\n", "status": "fail"}], "md": "### 3.20 A wallet with nothing left in it can finally be removed\n\nA wallet is up to four things: a record in `groups.json`, a name in\n`group-labels.json`, a derivation key, and its accounts. `forget_derivation`\nremoves the **key** and reports not-found when there is none \u2014 so a wallet that is\nnot derivable and holds no accounts had only a record, and nothing in this module\ncould take its row off the screen. `remove_group` is that method.\n\nIt removes the record and the name, and it **refuses while the wallet still holds\nanything** \u2014 a derivation key (live or staged) or an account. So it is never a\nsecond door to deleting a key, and because \"holds nothing\" is the precondition it\nneeds no password: there is nothing signable left for one to protect. The ladder\nbelow is the whole cost, and it is the correct cost \u2014 every rung that is refused is\nrefused because a spendable key is still under that row.\n\n```bash\nlogoscore call keystore_custodian name_wallet <g> \"Old phone\" <address> pw3\nlogoscore call keystore_module remove_group '{\"group\":\"<g>\"}'  # refused: Tier D\nlogoscore call keystore_custodian remove_wallet <g>            # refused: it still keeps a key\nlogoscore call keystore_custodian forget <g>\nlogoscore call keystore_custodian remove_wallet <g>            # refused: it still holds an account\nlogoscore call keystore_custodian delete <address> pw3\nlogoscore call keystore_custodian remove_wallet <g>            # the row goes\nlogoscore call keystore_module list_groups\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore call keystore_module caller_identity", "exit_code": 2, "kind": "run", "note": "exit code 2", "output": "{\"code\":\"NO_DAEMON\",\"message\":\"No daemon running (no local endpoint at /var/folders/df/djsxfhc17x95674wsm_g8s980000gn/T/logos_core_service_dc274d2185c0). A daemon that stopped removes it; start one in this session to get it back.\",\"status\":\"error\"}\n", "status": "fail"}], "md": "### 3.21 Ask the module who it thinks is calling\n\nThe CLI presents a host bootstrap anchor, so the keystore names it\n`host` \u2014 honestly, and without inventing a module name. `core` and\n`capability_module` share one token value under two keys, so an anchor\ncannot be attributed to any particular party. That is the whole reason\nthe next two steps refuse: the caller is named, and is not admitted.\n\n```bash\nlogoscore call keystore_module caller_identity\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore call keystore_module request_approval '{\"address\":\"0x0000000000000000000000000000000000000001\",\"purpose\":\"doc-test\",\"legs\":[{\"kind\":\"message\",\"text\":\"hello-logos\"}]}'", "exit_code": 2, "kind": "run", "note": "exit code 2", "output": "{\"code\":\"NO_DAEMON\",\"message\":\"No daemon running (no local endpoint at /var/folders/df/djsxfhc17x95674wsm_g8s980000gn/T/logos_core_service_dc274d2185c0). A daemon that stopped removes it; start one in this session to get it back.\",\"status\":\"error\"}\n", "status": "fail"}], "md": "### 3.22 Request a signature from the CLI \u2014 refused\n\n`request_approval` is Tier B: any **named module** may ask for a\nsignature. The CLI is not a named module, so it cannot even ask.\n\n```bash\nlogoscore call keystore_module request_approval '{...intent...}'\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore call keystore_module pending", "exit_code": 2, "kind": "run", "note": "exit code 2", "output": "{\"code\":\"NO_DAEMON\",\"message\":\"No daemon running (no local endpoint at /var/folders/df/djsxfhc17x95674wsm_g8s980000gn/T/logos_core_service_dc274d2185c0). A daemon that stopped removes it; start one in this session to get it back.\",\"status\":\"error\"}\n", "status": "fail"}], "md": "### 3.23 Approve a signature from the CLI \u2014 refused\n\n`approve` is Tier A: **only** the configured approver (`signer_ui`) may\napprove, and it must be a human doing it. There is no flag, token or\nargument that makes this succeed from a shell \u2014 which is the property\nthis module exists to provide.\n\n```bash\nlogoscore call keystore_module pending\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore stop", "exit_code": 2, "kind": "run", "note": "exit code 2", "output": "{\"code\":\"NO_DAEMON\",\"message\":\"No daemon running (no local endpoint at /var/folders/df/djsxfhc17x95674wsm_g8s980000gn/T/logos_core_service_dc274d2185c0). A daemon that stopped removes it; start one in this session to get it back.\",\"status\":\"error\"}\n", "status": "fail"}], "md": "### 3.24 Stop the daemon\n\n```bash\nlogoscore stop\n```"}, {"execs": [{"cmd": "sleep 2", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "```bash\nsleep 2\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore status || true", "exit_code": 0, "kind": "run", "note": "", "output": "{\"daemon\":{\"reason\":\"No daemon running (no local endpoint at /var/folders/df/djsxfhc17x95674wsm_g8s980000gn/T/logos_core_service_dc274d2185c0). A daemon that stopped removes it; start one in this session to get it back.\",\"status\":\"not_running\"}}\n", "status": "pass"}], "md": "### 3.25 Confirm the daemon has stopped\n\n```bash\nlogoscore status\n```"}]}], "version": 1}</script>
<script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.platform ? " · " + e.platform : ""}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });

    addAnchors(main, slug(t.meta.name));
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }

  // Octicon "link" — the same glyph GitHub puts next to markdown headings.
  const LINK_ICON =
    '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d=' +
    '"M7.775 3.275a.75.75 0 0 0 1.06 1.06l1.25-1.25a2 2 0 1 1 2.83 2.83l-2.5 2.5a2 2 0 0 1-2.83 0 ' +
    '.75.75 0 0 0-1.06 1.06 3.5 3.5 0 0 0 4.95 0l2.5-2.5a3.5 3.5 0 0 0-4.95-4.95l-1.25 1.25Zm-4.69 ' +
    '9.64a2 2 0 0 1 0-2.83l2.5-2.5a2 2 0 0 1 2.83 0 .75.75 0 0 0 1.06-1.06 3.5 3.5 0 0 0-4.95 0l-2.5 ' +
    '2.5a3.5 3.5 0 0 0 4.95 4.95l1.25-1.25a.75.75 0 0 0-1.06-1.06l-1.25 1.25a2 2 0 0 1-2.83 0Z"></path></svg>';

  // Give every heading a stable slug id (deduplicated the way GitHub does, with
  // -1/-2 suffixes) and a permalink whose href is "#<tutorial>/<heading>".
  function addAnchors(container, tutSlug) {
    const used = new Map();
    const nodes = container.querySelectorAll(
      ".tutorial-title, .md h1, .md h2, .md h3, .md h4, .md h5, .md h6"
    );
    nodes.forEach(node => {
      const text = node.textContent.trim();
      const isTitle = node.classList.contains("tutorial-title");
      let href = "#" + tutSlug;
      if (!isTitle) {
        const base = slug(text) || "section";
        const n = (used.get(base) || 0) + 1;
        used.set(base, n);
        node.id = n > 1 ? base + "-" + n : base;
        href += "/" + node.id;
      }
      node.classList.add("heading-anchored");
      const a = document.createElement("a");
      a.className = "anchor";
      a.href = href;
      a.title = "Copy link to this section";
      a.setAttribute("aria-label", "Permalink: " + text);
      a.innerHTML = LINK_ICON;
      node.insertBefore(a, node.firstChild);
    });
  }

  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
  }

  // navigator.clipboard needs a secure context; reports are often opened over
  // file://, so fall back to the old execCommand path there.
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(
        () => toast("Link copied"),
        () => toast(text)
      );
      return;
    }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? "Link copied" : text);
  }

  function scrollToId(id) {
    if (!id) { window.scrollTo(0, 0); return; }
    const el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ block: "start" });
    el.classList.remove("flash");
    void el.offsetWidth;  // restart the animation on a repeat click
    el.classList.add("flash");
  }

  document.addEventListener("click", ev => {
    const a = ev.target.closest && ev.target.closest("a.anchor");
    if (!a) return;
    ev.preventDefault();
    const href = a.getAttribute("href");
    copyText(location.href.split("#")[0] + href);
    if (location.hash === href) scrollToId(a.parentNode.id);
    else location.hash = href;  // hashchange scrolls
  });

  // "#<tutorial>" (name, slug, or index) optionally followed by "/<heading>".
  function parseHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return { idx: 0, frag: "" };
    const cut = raw.indexOf("/");
    const tut = cut >= 0 ? raw.slice(0, cut) : raw;
    const frag = cut >= 0 ? raw.slice(cut + 1) : "";
    if (/^\d+$/.test(tut) && +tut < DATA.tutorials.length) return { idx: +tut, frag };
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === tut || t.meta.name === tut
    );
    if (i >= 0) return { idx: i, frag };
    // No tutorial matched: treat a bare hash as a heading in the current one.
    return { idx: currentIdx >= 0 ? currentIdx : 0, frag: cut >= 0 ? frag : raw };
  }

  let currentIdx = -1;
  function show(idx, frag) {
    if (idx !== currentIdx) {
      picker.value = idx;
      render(idx);
      currentIdx = idx;
    }
    if (frag) requestAnimationFrame(() => scrollToId(frag));
  }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    show(+picker.value);
  });
  window.addEventListener("hashchange", () => {
    const h = parseHash();
    show(h.idx, h.frag);
  });
  const initial = parseHash();
  show(initial.idx, initial.frag);
  // Inlined screenshots have no intrinsic size until decoded, so the first
  // scroll can land short; re-anchor once everything has loaded.
  if (initial.frag) {
    window.addEventListener("load", () => scrollToId(initial.frag), { once: true });
  }
</script>
</body>
