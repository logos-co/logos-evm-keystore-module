deployment that configures nothing still works. Here the custodian is the fixture\ninstead, and the change takes effect on the next call: nothing is restarted. This\ndocument names no manager, so from here on nothing may ask this keystore to sign.\n\nIt is **ungated for now**, which is a real and deliberate exposure: nothing stops a\ncaller naming *itself* custodian and then mutating the keystore \u2014 this very step is\nthe CLI writing that policy. Protecting the call is deferred, not refuted. The\nrefusals below are real, but they refuse a policy the same caller could have\nwritten differently.\n\n```bash\nlogosctl call keystore_module configure '{\"approvers\":\"evm_signer_ui\",\"custodians\":\"keystore_custodian\"}'\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session module show keystore_module", "exit_code": 0, "kind": "run", "note": "", "output": "{\"dependencies\":[],\"dependents\":[\"keystore_custodian\"],\"events\":[{\"name\":\"accounts_changed\",\"parameters\":[{\"name\":\"count\",\"type\":\"int\"}],\"signature\":\"accounts_changed(int)\",\"type\":\"event\"},{\"name\":\"approval_offered\",\"parameters\":[{\"name\":\"handle\",\"type\":\"QString\"}],\"signature\":\"approval_offered(QString)\",\"type\":\"event\"},{\"name\":\"approval_settled\",\"parameters\":[{\"name\":\"handle\",\"type\":\"QString\"},{\"name\":\"state\",\"type\":\"QString\"}],\"signature\":\"approval_settled(QString,QString)\",\"type\":\"event\"},{\"name\":\"signer_accounts_changed\",\"parameters\":[{\"name\":\"count\",\"type\":\"int\"}],\"signature\":\"signer_accounts_changed(int)\",\"type\":\"event\"},{\"name\":\"signer_changed\",\"parameters\":[{\"name\":\"state\",\"type\":\"QString\"}],\"signature\":\"signer_changed(QString)\",\"type\":\"event\"},{\"name\":\"sign_progress\",\"parameters\":[{\"name\":\"job\",\"type\":\"QString\"},{\"name\":\"state\",\"type\":\"QString\"}],\"signature\":\"sign_progress(QString,QString)\",\"type\":\"event\"}],\"methods\":[{\"isInvokable "type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"sign_status(QString)\"},{\"isInvokable\":true,\"name\":\"sign_result\",\"parameters\":[{\"name\":\"job\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"sign_result(QString)\"},{\"isInvokable\":true,\"name\":\"cancel_sign\",\"parameters\":[{\"name\":\"job\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"cancel_sign(QString)\"},{\"isInvokable\":true,\"name\":\"unlock_key\",\"parameters\":[{\"name\":\"request_json\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"unlock_key(QString)\"},{\"isInvokable\":true,\"name\":\"unlock_key_status\",\"parameters\":[{\"name\":\"job\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"unlock_key_status(QString)\"},{\"isInvokable\":true,\"name\":\"unlock_key_result\",\"parameters\":[{\"name\":\"job\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"unlock_key_result(QString)\"},{\"isInvokable\":true,\"name\":\"cancel_unlock_key\",\"parameters\":[{\"name\":\"job\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"cancel_unlock_key(QString)\"},{\"isInvokable\":true,\"name\":\"unlock\",\"parameters\":[{\"name\":\"params_json\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"unlock(QString)\"},{\"isInvokable\":true,\"name\":\"lock\",\"parameters\":[{\"name\":\"params_json\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"lock(QString)\"},{\"isInvokable\":true,\"name\":\"unlocked\",\"returnType\":\"QString\",\"signature\":\"unlocked()\"},{\"isInvokable\":true,\"name\":\"database_key\",\"parameters\":[{\"name\":\"params_json\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"database_key(QString)\"},{\"isInvokable\":true,\"name\":\"device_database_key\",\"parameters\":[{\"name\":\"params_json\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"device_database_key(QString)\"},{\"isInvokable\":true,\"name\":\"device_wallets\",\"returnType\":\"QString\",\"signature\":\"device_wallets()\"},{\"isInvokable\":true,\"name\":\"forget_device_wallet\",\"parameters\":[{\"name\":\"params_json\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"forget_device_wallet(QString)\"},{\"isInvokable\":true,\"name\":\"import_bitcoin\",\"parameters\":[{\"name\":\"params_json\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"import_bitcoin(QString)\"},{\"isInvokable\":true,\"name\":\"show_phrase\",\"parameters\":[{\"name\":\"params_json\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"show_phrase(QString)\"},{\"isInvokable\":true,\"name\":\"forget_phrase\",\"parameters\":[{\"name\":\"params_json\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"forget_phrase(QString)\"},{\"isInvokable\":true,\"name\":\"list_phrases\",\"returnType\":\"QString\",\"signature\":\"list_phrases()\"},{\"isInvokable\":true,\"name\":\"account_descriptors\",\"parameters\":[{\"name\":\"params_json\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"account_descriptors(QString)\"},{\"isInvokable\":true,\"name\":\"caller_identity\",\"returnType\":\"QString\",\"signature\":\"caller_identity()\"},{\"isInvokable\":true,\"name\":\"name\",\"returnType\":\"QString\",\"signature\":\"name()\"},{\"isInvokable\":true,\"name\":\"version\",\"returnType\":\"QString\",\"signature\":\"version()\"}],\"name\":\"keystore_module\",\"status\":\"loaded\",\"uptime_seconds\":0,\"version\":\"0.1.0\"}\n", "status": "pass"}], "md": "### 3.3 Introspect the module\n\n```bash\nlogosctl module show keystore_module\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session call keystore_module signer_info", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"signer_info\",\"module\":\"keystore_module\",\"result\":\"{\\\"collects\\\":\\\"password\\\",\\\"families\\\":[\\\"evm\\\",\\\"bitcoin\\\",\\\"bitcoin_taproot\\\"],\\\"interface\\\":\\\"logos.signer/1\\\",\\\"kind\\\":\\\"keystore\\\",\\\"model\\\":\\\"scrypt key files\\\",\\\"ok\\\":true,\\\"requestKinds\\\":[\\\"hash\\\"],\\\"showsRequest\\\":false,\\\"unlockKey\\\":true}\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 3.4 The keystore is a signer\n\nThe keystore implements `logos.signer/1`, the contract the signer manager binds every\nsigner module through. `signer_info` describes the kind of signer, not any account,\nso it answers anyone: a keystore signs hashes, and the host collects a password.\n\n```bash\nlogosctl call keystore_module signer_info\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session call keystore_module sign '{\"account\":\"0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266\",\"kind\":\"hash\",\"items\":[]}'\n./logos/bin/logosctl --config-dir ./session call keystore_module unlock '{\"account\":\"0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266\",\"password\":\"pw\"}'\n./logos/bin/logosctl --config-dir ./session call keystore_module signer_accounts\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"sign\",\"module\":\"keystore_module\",\"result\":\"{\\\"error\\\":\\\"not authorized\\\",\\\"ok\\\":false}\",\"status\":\"ok\"}\n{\"method\":\"unlock\",\"module\":\"keystore_module\",\"result\":\"{\\\"error\\\":\\\"not authorized\\\",\\\"ok\\\":false}\",\"status\":\"ok\"}\n{\"method\":\"signer_accounts\",\"module\":\"keystore_module\",\"result\":\"{\\\"error\\\":\\\"not authorized\\\",\\\"ok\\\":false}\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 3.5 \u2026and only the manager may ask it to sign\n\n`sign` and `unlock` are Tier M, the configured manager's: the manager keeps which apps\nan unlock covers, so anything reaching `sign` past it would sign inside an unlock it\nwas never granted. The CLI's host anchor is refused with the same string as every\nother tier, and so is a listing of accounts, whose Bitcoin xpubs reveal a wallet's\nhistory.\n\n```bash\nlogosctl call keystore_module sign '{...}'\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session module load keystore_custodian", "exit_code": 0, "kind": "run", "note": "", "output": "{\"dependencies_loaded\":[],\"module\":\"keystore_custodian\",\"status\":\"ok\",\"version\":\"1.0.0\"}\n", "status": "pass"}], "md": "### 3.6 Load the custodian fixture\n\n```bash\n./logos/bin/logosctl --config-dir ./session module load keystore_custodian\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session call keystore_module create_mnemonic 12\n./logos/bin/logosctl --config-dir ./session call keystore_module import_private_key ac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80 pw\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"create_mnemonic\",\"module\":\"keystore_module\",\"result\":\"{\\\"error\\\":\\\"not authorized\\\",\\\"ok\\\":false}\",\"status\":\"ok\"}\n{\"method\":\"import_private_key\",\"module\":\"keystore_module\",\"result\":\"{\\\"error\\\":\\\"not authorized\\\",\\\"ok\\\":false}\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 3.7 The CLI cannot mutate the keystore\n\nThe CLI authenticates as the **host anchor** \u2014 one undifferentiated bag covering\nthe shells and every relayed token. Admitting it would make `logosctl call` a\nlegal way to import a key, so Tier D refuses it. The refusal string is identical\nto Tier A's and Tier B's, so a caller cannot use the error text to work out which\ntier it failed.\n\n```bash\nlogosctl call keystore_module import_private_key <privkey> pw\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session call keystore_module derive_next_account '{\"groupPassword\":\"gp\",\"password\":\"pw\"}'", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"derive_next_account\",\"module\":\"keystore_module\",\"result\":\"{\\\"error\\\":\\\"not authorized\\\",\\\"ok\\\":false}\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 3.8 \u2026and it cannot derive an account either\n\nHD derivation is account mutation, so it sits behind the same gate. It also opens a\nvault whose blast radius is a whole wallet rather than one account \u2014 an `extkey`\ngroup's stored key reaches every address under one BIP-44 account, past and future.\nThe refusal is byte-identical to the one above.\n\n```bash\nlogosctl call keystore_module derive_next_account '{\"groupPassword\":\"gp\",\"password\":\"pw\"}'\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session call keystore_module list_accounts", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"list_accounts\",\"module\":\"keystore_module\",\"result\":\"{\\\"accounts\\\":[],\\\"mismatched\\\":[],\\\"ok\\\":true,\\\"staged\\\":[],\\\"unexplained\\\":[]}\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 3.9 \u2026but the ungated reads still work\n\nThe gate closed account *mutation*, not the module. A wallet must still be able to\nshow which accounts exist \u2014 that is exactly the line Tier D draws.\n\n```bash\nlogosctl call keystore_module list_accounts\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session call keystore_custodian mnemonic 12", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"mnemonic\",\"module\":\"keystore_custodian\",\"result\":\"{\\\"ok\\\":true,\\\"phrase\\\":\\\"shoulder famous first furnace resist faith odor cover dose follow term vapor\\\"}\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 3.10 Generate a BIP-39 mnemonic, through the custodian\n\nThe other side of the refusal two steps up: the same Tier D method, from the module\n`configure` just named custodian. It persists nothing, so what it proves is the\ngate and only the gate.\n\n```bash\nlogosctl call keystore_custodian mnemonic 12\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session call keystore_custodian import_key ac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80 pw", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"import_key\",\"module\":\"keystore_custodian\",\"result\":\"{\\\"address\\\":\\\"0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266\\\",\\\"ok\\\":true}\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 3.11 Import a known private key\n\nImport Foundry's account-0 private key under a passphrase. The module\nreturns only the **address** \u2014 the key stays inside the scrypt vault.\n\n```bash\nlogosctl call keystore_custodian import_key <privkey> pw\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session call keystore_module list_accounts", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"list_accounts\",\"module\":\"keystore_module\",\"result\":\"{\\\"accounts\\\":[\\\"0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266\\\"],\\\"mismatched\\\":[],\\\"ok\\\":true,\\\"staged\\\":[],\\\"unexplained\\\":[]}\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 3.12 List accounts\n\n```bash\nlogosctl call keystore_module list_accounts\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session call keystore_custodian create pw false", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"create\",\"module\":\"keystore_custodian\",\"result\":\"{\\\"error\\\":\\\"an unrelated account is a key your recovery phrase will not restore \u2014 its only backup is a vault file you export and keep yourself. Pass acknowledgeUnrecoverable: true to create it anyway\\\",\\\"ok\\\":false}\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 3.13 A key no recovery phrase covers needs an acknowledgement\n\n`create_unrelated_account` is the **one** way to obtain a key generated from\nrandomness rather than derived from a phrase. There used to be a second,\n`new_account`, which minted one silently on a keystore that looked empty \u2014 whether\nthat was safe rested on a directory scan being complete, and \"is there live key\nmaterial anywhere under this store\" is not decidable by inspection.\n\nThe acknowledgement is. Note who is refused here: the **custodian**, the one caller\nTier D admits. The acknowledgement is a property of the call, not of the caller, so\nthere is no identity that skips it.\n\n```bash\nlogosctl call keystore_custodian create pw false\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session call keystore_custodian create pw true", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"create\",\"module\":\"keystore_custodian\",\"result\":\"{\\\"address\\\":\\\"0x556169274A515F793c0782621eA833F4601E674E\\\",\\\"ok\\\":true,\\\"origin\\\":\\\"random\\\"}\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 3.14 \u2026and with it, the key lands\n\nSame caller, same password, one argument different. The refusal above is not a\nrate limit or a retry \u2014 the key does not exist until it is acknowledged.\n\n```bash\nlogosctl call keystore_custodian create pw true\n```"}, {"execs": [{"cmd": "base=\"session/data/keystore_module\"\nd=$(find \"$base\" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | head -1)\n[ -n \"$d\" ] || { echo \"FATAL: no instance directory under $base -- the daemon never loaded keystore_module\"; exit 1; }\nprintf 'x' > \"$d/keystore/v2/notes.txt\"\n./logos/bin/logosctl --config-dir ./session call keystore_module list_accounts\n./logos/bin/logosctl --config-dir ./session call keystore_custodian create pw true\n./logos/bin/logosctl --config-dir ./session call keystore_custodian settle\n./logos/bin/logosctl --config-dir ./session call keystore_custodian remove notes.txt\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"list_accounts\",\"module\":\"keystore_module\",\"result\":\"{\\\"accounts\\\":[\\\"0x556169274A515F793c0782621eA833F4601E674E\\\",\\\"0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266\\\"],\\\"mismatched\\\":[],\\\"ok\\\":true,\\\"staged\\\":[],\\\"unexplained\\\":[\\\"notes.txt\\\"]}\",\"status\":\"ok\"}\n{\"method\":\"create\",\"module\":\"keystore_custodian\",\"result\":\"{\\\"address\\\":\\\"0xCE89aD0D96c107429f3521c522b0925A25C8d425\\\",\\\"ok\\\":true,\\\"origin\\\":\\\"random\\\"}\",\"status\":\"ok\"}\n{\"method\":\"settle\",\"module\":\"keystore_custodian\",\"result\":\"{\\\"importStages\\\":[],\\\"links\\\":[],\\\"ok\\\":true,\\\"promoted\\\":[],\\\"staged\\\":[],\\\"swept\\\":[],\\\"unexplained\\\":[\\\"notes.txt\\\"]}\",\"status\":\"ok\"}\n{\"method\":\"remove\",\"module\":\"keystore_custodian\",\"result\":\"{\\\"ok\\\":true,\\\"removed\\\":true}\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 3.15 A file the keystore did not write is reported, not a wedge\n\nDrop a `notes.txt` into the keystore directory. The scan cannot explain it, and it\nsays so \u2014 but it no longer refuses anything: listing, creating and sweeping all\nkeep working, and the reported path is removable by name. When the scan was the\nsafety gate this was a brick, because anything it could not name might have been a\nhidden derivation key.\n\nThis is the one step that reaches into the module's own directory, and it is not\nconfiguration: it stands in for the operating system putting a file there, which no\nmethod call can simulate. It is what the module has to survive, not how it is told\nanything.\n\n```bash\necho x > <module-data>/keystore/v2/notes.txt\nlogosctl call keystore_module list_accounts\nlogosctl call keystore_custodian remove notes.txt\n```"}, {"execs": [{"cmd": "base=\"session/data/keystore_module\"\nd=$(find \"$base\" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | head -1)\n[ -n \"$d\" ] || { echo \"FATAL: no instance directory under $base\"; exit 1; }\nmkdir -p \"$d/keystore/v2/groups\"\nprintf '\\000\\000\\000\\001Bud1\\000\\000\\020\\000\\250\\377\\200\\013' > \"$d/keystore/v2/.DS_Store\"\ncp \"$d/keystore/v2/.DS_Store\" \"$d/keystore/v2/groups/.DS_Store\"\nout=$(./logos/bin/logosctl --config-dir ./session call keystore_module list_accounts\n      ./logos/bin/logosctl --config-dir ./session call keystore_custodian settle)\necho \"$out\"\ncase \"$out\" in *DS_Store*) echo \"FAIL: a file browser's file was reported\"; exit 1;; esac\necho \"not reported\"\n./logos/bin/logosctl --config-dir ./session call keystore_custodian remove groups/.DS_Store\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"list_accounts\",\"module\":\"keystore_module\",\"result\":\"{\\\"accounts\\\":[\\\"0x556169274A515F793c0782621eA833F4601E674E\\\",\\\"0xCE89aD0D96c107429f3521c522b0925A25C8d425\\\",\\\"0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266\\\"],\\\"mismatched\\\":[],\\\"ok\\\":true,\\\"staged\\\":[],\\\"unexplained\\\":[]}\",\"status\":\"ok\"}\n{\"method\":\"settle\",\"module\":\"keystore_custodian\",\"result\":\"{\\\"importStages\\\":[],\\\"links\\\":[],\\\"ok\\\":true,\\\"promoted\\\":[],\\\"staged\\\":[],\\\"swept\\\":[],\\\"unexplained\\\":[]}\",\"status\":\"ok\"}\nnot reported\n{\"method\":\"remove\",\"module\":\"keystore_custodian\",\"result\":\"{\\\"ok\\\":true,\\\"removed\\\":true}\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 3.16 \u2026but a file browser's own file is not even reported\n\nFinder writes a `.DS_Store` into any folder it shows, the key directory included.\nA real one is binary, and it is neither key material nor reported, wherever it sits:\na vault is JSON text, and a file read in full that holds none is not one. A vault\nsaved under that name is still judged as a vault. It stays removable by name.\n\n```bash\n# with Finder's .DS_Store in <module-data>/keystore/v2/ and keystore/v2/groups/\nlogosctl call keystore_module list_accounts\nlogosctl call keystore_custodian remove groups/.DS_Store\n```"}, {"execs": [{"cmd": "base=\"session/data/keystore_module\"\nd=$(find \"$base\" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | head -1)\n[ -n \"$d\" ] || { echo \"FATAL: no instance directory under $base\"; exit 1; }\nk=\"$d/keystore\"\naddrs() { grep -o '0x[0-9a-fA-F]\\{40\\}' | sort -u; }\nbefore=$(./logos/bin/logosctl --config-dir ./session call keystore_module list_accounts | addrs)\n[ -n \"$before\" ] || { echo \"FATAL: no accounts to move\"; exit 1; }\n( cd \"$k/v2\" && for f in * .[!.]*; do [ -e \"$f\" ] || continue; mv \"$f\" ..; done )\nhidden=$(./logos/bin/logosctl --config-dir ./session call keystore_module list_accounts | addrs)\n[ -z \"$hidden\" ] || { echo \"FAIL: read before it moved: $hidden\"; exit 1; }\necho \"not listed until it moves\"\n./logos/bin/logosctl --config-dir ./session call keystore_module older_keystore\n./logos/bin/logosctl --config-dir ./session call keystore_custodian move_older\nafter=$(./logos/bin/logosctl --config-dir ./session call keystore_module list_accounts | addrs)\necho \"$after\"\n[ \"$after\" = \"$before\" ] && echo \"the same accounts, back\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "not listed until it moves\n{\"method\":\"older_keystore\",\"module\":\"keystore_module\",\"result\":\"{\\\"accounts\\\":3,\\\"devices\\\":0,\\\"documents\\\":[\\\"seeds.json\\\",\\\"index.pending.json\\\"],\\\"keys\\\":0,\\\"left\\\":[],\\\"ok\\\":true,\\\"phrases\\\":0}\",\"status\":\"ok\"}\n{\"method\":\"move_older\",\"module\":\"keystore_custodian\",\"result\":\"{\\\"accounts\\\":3,\\\"devices\\\":0,\\\"documents\\\":[\\\"seeds.json\\\",\\\"index.pending.json\\\"],\\\"keys\\\":0,\\\"left\\\":[],\\\"ok\\\":true,\\\"phrases\\\":0}\",\"status\":\"ok\"}\n0x556169274A515F793c0782621eA833F4601E674E\n0xCE89aD0D96c107429f3521c522b0925A25C8d425\n0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266\nthe same accounts, back\n", "status": "pass"}], "md": "### 3.17 An older build's keystore moves in when asked\n\nThis build keeps its keystore in `keystore/v2/`. Builds before it wrote `keystore/`\nitself, and what they left there is not read: those wallets are not listed until they\nare moved in, which the keys app offers. Moving this keystore's files up a level stands\nin for an older build's. `older_keystore` counts them; `move_older_keystore` (Tier D)\nrenames them back under `v2/` and joins their bookkeeping to this one's, seed by seed.\n\n```bash\nlogosctl call keystore_module older_keystore\nlogosctl call keystore_custodian move_older\nlogosctl call keystore_module list_accounts\n```"}, {"execs": [{"cmd": "r=$(./logos/bin/logosctl --config-dir ./session call keystore_custodian import_phrase 'abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about' gp pw2 0)\ng=$(echo \"$r\" | grep -o 'g_[0-9a-f]\\{32\\}' | head -1)\na=$(echo \"$r\" | grep -o '0x[0-9a-fA-F]\\{40\\}' | head -1); a=${a#0x}\n./logos/bin/logosctl --config-dir ./session call keystore_module set_group_label \"{\\\"group\\\":\\\"$g\\\",\\\"label\\\":\\\"Cold storage\\\"}\"\n./logos/bin/logosctl --config-dir ./session call keystore_custodian name_wallet \"$g\" \"Cold storage\" \"$a\" wrong-password\n./logos/bin/logosctl --config-dir ./session call keystore_custodian name_wallet \"$g\" \"Cold storage\" \"\" \"\"\n./logos/bin/logosctl --config-dir ./session call keystore_custodian name_wallet \"$g\" \"Cold storage\" \"$a\" pw2\n./logos/bin/logosctl --config-dir ./session call keystore_module get_group_labels\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"set_group_label\",\"module\":\"keystore_module\",\"result\":\"{\\\"error\\\":\\\"not authorized\\\",\\\"ok\\\":false}\",\"status\":\"ok\"}\n{\"method\":\"name_wallet\",\"module\":\"keystore_custodian\",\"result\":\"{\\\"error\\\":\\\"the password for this account is not correct\\\",\\\"ok\\\":false}\",\"status\":\"ok\"}\n{\"method\":\"name_wallet\",\"module\":\"keystore_custodian\",\"result\":\"{\\\"error\\\":\\\"naming a wallet that has accounts needs the password of one of them\\\",\\\"ok\\\":false}\",\"status\":\"ok\"}\n{\"method\":\"name_wallet\",\"module\":\"keystore_custodian\",\"result\":\"{\\\"ok\\\":true}\",\"status\":\"ok\"}\n{\"method\":\"get_group_labels\",\"module\":\"keystore_module\",\"result\":\"{\\\"labels\\\":{\\\"g_d4130d5590b460b62328553df9843d24\\\":\\\"Cold storage\\\"},\\\"ok\\\":true}\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 3.18 Name a wallet \u2014 and prove you hold one of its accounts\n\nA derivation group has no name of its own to fall back on: what a UI shows is its\nfirst account's address, and deleting that account moves it. `set_group_label`\ngives it one. It is Tier D, so the CLI is refused and the custodian is not.\n\nTier D is not the whole story here. A name is the one string in this keystore that\nan attacker chooses and a human reads \u2014 it is rendered *in place of* an address \u2014\nso setting one now also needs the vault password of **one of the wallet's own\naccounts**. Holding an account is precisely the claim \"this wallet is mine\". The\n*group* password is not accepted here: it proves you can make accounts, not that\nyou own the ones the header speaks for. Where the wallet has **no** accounts and\nonly a key, it is the credential \u2014 see the next step.\n\n`get_group_labels` is **ungated**, and answers from its own document rather than\nfrom the group record \u2014 so the name outlives the record and the key it belonged to,\nwhich is exactly the row a UI has to name while asking whether to delete it. Two\nwallets may carry one name: telling them apart is the reader's job, and refusing\nthe write would only stop it showing what the user actually did.\n\n```bash\nlogosctl call keystore_module set_group_label '{\"group\":\"<g>\",\"label\":\"Cold storage\"}'   # refused: Tier D\nlogosctl call keystore_custodian name_wallet <g> \"Cold storage\" <address> wrong-password # refused: password\nlogosctl call keystore_custodian name_wallet <g> \"Cold storage\" \"\" \"\"                    # refused: no account named\nlogosctl call keystore_custodian name_wallet <g> \"Cold storage\" <address> pw2            # written\nlogosctl call keystore_module get_group_labels\n```"}, {"execs": [{"cmd": "r=$(./logos/bin/logosctl --config-dir ./session call keystore_custodian import_phrase 'abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about' gp4 pw4 5)\ng=$(echo \"$r\" | grep -o 'g_[0-9a-f]\\{32\\}' | head -1)\na=$(echo \"$r\" | grep -o '0x[0-9a-fA-F]\\{40\\}' | head -1); a=${a#0x}\n./logos/bin/logosctl --config-dir ./session call keystore_custodian delete \"$a\" pw4\n./logos/bin/logosctl --config-dir ./session call keystore_custodian name_wallet \"$g\" \"Cold storage\" \"\" \"\"\n./logos/bin/logosctl --config-dir ./session call keystore_custodian name_wallet \"$g\" \"Cold storage\" \"\" wrong-password\n./logos/bin/logosctl --config-dir ./session call keystore_custodian name_wallet \"$g\" \"Cold storage\" \"\" gp4\n./logos/bin/logosctl --config-dir ./session call keystore_custodian derive \"$g\" gp4 pw4\n./logos/bin/logosctl --config-dir ./session call keystore_module list_groups\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"delete\",\"module\":\"keystore_custodian\",\"result\":\"{\\\"ok\\\":true}\",\"status\":\"ok\"}\n{\"method\":\"name_wallet\",\"module\":\"keystore_custodian\",\"result\":\"{\\\"error\\\":\\\"naming a wallet that keeps a derivation key needs that key's password\\\",\\\"ok\\\":false}\",\"status\":\"ok\"}\n{\"method\":\"name_wallet\",\"module\":\"keystore_custodian\",\"result\":\"{\\\"error\\\":\\\"the password for this wallet's derivation key is not correct\\\",\\\"ok\\\":false}\",\"status\":\"ok\"}\n{\"method\":\"name_wallet\",\"module\":\"keystore_custodian\",\"result\":\"{\\\"ok\\\":true}\",\"status\":\"ok\"}\n{\"method\":\"derive\",\"module\":\"keystore_custodian\",\"result\":\"{\\\"address\\\":\\\"0x4327566fbD5213538A40E23CeB274a26506dC0E5\\\",\\\"group\\\":\\\"g_c73d10f81d6b3798266c1342ec9bf2c0\\\",\\\"index\\\":1,\\\"ok\\\":true,\\\"origin\\\":\\\"derived\\\",\\\"path\\\":\\\"m/44'/60'/5'/0/1\\\"}\",\"status\":\"ok\"}\n{\"method\":\"list_groups\",\"module\":\"keystore_module\",\"result\":\"{\\\"addAgain\\\":[],\\\"groups\\\":[{\\\"accountCount\\\":1,\\\"chain\\\":null,\\\"derivable\\\":true,\\\"family\\\":null,\\\"id\\\":\\\"g_c73d10f81d6b3798266c1342ec9bf2c0\\\",\\\"label\\\":\\\"Cold storage\\\",\\\"needsPhrase\\\":false,\\\"nextIndex\\\":2,\\\"pathPrefix\\\":\\\"m/44'/60'/5'\\\",\\\"phrase\\\":null,\\\"preview\\\":null,\\\"retiredIndices\\\":[0],\\\"seedId\\\":\\\"g_8224236fcc61796f71d47949f910181a\\\",\\\"staged\\\":false,\\\"storage\\\":\\\"extkey\\\",\\\"stranded\\\":false,\\\"usedIndices\\\":[1],\\\"usedPassphrase\\\":false,\\\"walletName\\\":null},{\\\"accountCount\\\":1,\\\"chain\\\":null,\\\"derivable\\\":true,\\\"family\\\":null,\\\"id\\\":\\\"g_d4130d5590b460b62328553df9843d24\\\",\\\"label\\\":\\\"Cold storage\\\",\\\"needsPhrase\\\":false,\\\"nextIndex\\\":1,\\\"pathPrefix\\\":\\\"m/44'/60'/0'\\\",\\\"phrase\\\":null,\\\"preview\\\":null,\\\"retiredIndices\\\":[],\\\"seedId\\\":\\\"g_8224236fcc61796f71d47949f910181a\\\",\\\"staged\\\":false,\\\"storage\\\":\\\"extkey\\\",\\\"stranded\\\":false,\\\"usedIndices\\\":[0],\\\"usedPassphrase\\\":false,\\\"walletName\\\":null}],\\\"lockedSeeds\\\":[],\\\"lockedWallets\\\":0,\\\"ok\\\":true}\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 3.19 A wallet that can still mint accounts is named by its derivation key\n\n\"No accounts\" is not \"holds nothing\". A wallet that keeps a derivation key and has\nno accounts *yet* will have them, and they will be shown under whatever name is on\nthe header \u2014 so a name written here with no proof comes to stand over a real\naccount the moment one is derived. The exemption is therefore for a wallet that\nholds **nothing**: no accounts *and* no key at either path, which is the same\nprecondition `remove_group` refuses on.\n\nWith a key and no accounts there is no account to hold, so what proves the name is\nthe thing that will mint them: the **derivation key's** own password. Clearing a\nname still asks for nothing, and `forget_derivation` still takes no password \u2014 a\nkey you cannot open stays deletable.\n\n```bash\nlogosctl call keystore_custodian delete <address> pw4          # the wallet now has no accounts\nlogosctl call keystore_custodian name_wallet <g> \"Cold storage\" \"\" \"\"              # refused: needs the key\nlogosctl call keystore_custodian name_wallet <g> \"Cold storage\" \"\" wrong-password  # refused: password\nlogosctl call keystore_custodian name_wallet <g> \"Cold storage\" \"\" gp4             # written\nlogosctl call keystore_custodian derive <g> gp4 pw4            # and now the name stands over an account\nlogosctl call keystore_module list_groups\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session call keystore_custodian name_account f39Fd6e51aad88F6F4ce6aB8827279cffFb92266 Treasury wrong-password\n./logos/bin/logosctl --config-dir ./session call keystore_module get_labels\n./logos/bin/logosctl --config-dir ./session call keystore_custodian name_account f39Fd6e51aad88F6F4ce6aB8827279cffFb92266 Treasury pw\n./logos/bin/logosctl --config-dir ./session call keystore_module get_labels\n./logos/bin/logosctl --config-dir ./session call keystore_custodian name_account f39Fd6e51aad88F6F4ce6aB8827279cffFb92266 \"  \" nonsense\n./logos/bin/logosctl --config-dir ./session call keystore_module get_labels\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"name_account\",\"module\":\"keystore_custodian\",\"result\":\"{\\\"error\\\":\\\"the password for this account is not correct\\\",\\\"ok\\\":false}\",\"status\":\"ok\"}\n{\"method\":\"get_labels\",\"module\":\"keystore_module\",\"result\":\"{\\\"labels\\\":{},\\\"ok\\\":true}\",\"status\":\"ok\"}\n{\"method\":\"name_account\",\"module\":\"keystore_custodian\",\"result\":\"{\\\"ok\\\":true}\",\"status\":\"ok\"}\n{\"method\":\"get_labels\",\"module\":\"keystore_module\",\"result\":\"{\\\"labels\\\":{\\\"f39fd6e51aad88f6f4ce6ab8827279cfffb92266\\\":\\\"Treasury\\\"},\\\"ok\\\":true}\",\"status\":\"ok\"}\n{\"method\":\"name_account\",\"module\":\"keystore_custodian\",\"result\":\"{\\\"ok\\\":true}\",\"status\":\"ok\"}\n{\"method\":\"get_labels\",\"module\":\"keystore_module\",\"result\":\"{\\\"labels\\\":{},\\\"ok\\\":true}\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 3.20 Naming an account proves you hold that account\n\nThe same rule, one level down, and this is the sharper case: `set_label` writes the\nstring a wallet renders *instead of* an address in its account picker. Renaming\n\"Savings\" to something a user would fund is exactly the attack, so setting a name\nneeds that account's own vault password.\n\n**Clearing a name needs nothing.** It can only move the display back toward the raw\naddress, which is ground truth \u2014 it cannot impersonate anyone \u2014 and it is the one\nway to strip a stale name off an account whose password is lost. Without that\nexemption we would rebuild the wedge `forget_derivation` exists to avoid: a thing\nyou cannot open and therefore cannot manage.\n\nThe account below is Foundry's account 0, imported near the top of this run under\nthe password `pw`.\n\n```bash\nlogosctl call keystore_custodian name_account <address> Treasury wrong-password  # refused\nlogosctl call keystore_custodian name_account <address> Treasury pw              # written\nlogosctl call keystore_custodian name_account <address> \"  \" nonsense            # cleared, no password\nlogosctl call keystore_module get_labels\n```"}, {"execs": [{"cmd": "r=$(./logos/bin/logosctl --config-dir ./session call keystore_custodian import_phrase 'abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about' gp2 pw3 1)\ng=$(echo \"$r\" | grep -o 'g_[0-9a-f]\\{32\\}' | head -1)\na=$(echo \"$r\" | grep -o '0x[0-9a-fA-F]\\{40\\}' | head -1); a=${a#0x}\n./logos/bin/logosctl --config-dir ./session call keystore_custodian name_wallet \"$g\" \"Old phone\" \"$a\" pw3\n./logos/bin/logosctl --config-dir ./session call keystore_module remove_group \"{\\\"group\\\":\\\"$g\\\"}\"\n./logos/bin/logosctl --config-dir ./session call keystore_custodian remove_wallet \"$g\"\n./logos/bin/logosctl --config-dir ./session call keystore_custodian forget \"$g\"\n./logos/bin/logosctl --config-dir ./session call keystore_custodian remove_wallet \"$g\"\n./logos/bin/logosctl --config-dir ./session call keystore_custodian delete \"$a\" pw3\n./logos/bin/logosctl --config-dir ./session call keystore_custodian remove_wallet \"$g\"\n./logos/bin/logosctl --config-dir ./session call keystore_module list_groups\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"name_wallet\",\"module\":\"keystore_custodian\",\"result\":\"{\\\"ok\\\":true}\",\"status\":\"ok\"}\n{\"method\":\"remove_group\",\"module\":\"keystore_module\",\"result\":\"{\\\"error\\\":\\\"not authorized\\\",\\\"ok\\\":false}\",\"status\":\"ok\"}\n{\"method\":\"remove_wallet\",\"module\":\"keystore_custodian\",\"result\":\"{\\\"error\\\":\\\"this wallet still keeps a derivation key \u2014 stop keeping it first\\\",\\\"ok\\\":false}\",\"status\":\"ok\"}\n{\"method\":\"forget\",\"module\":\"keystore_custodian\",\"result\":\"{\\\"group\\\":\\\"g_19cac975b260bf78ce70c5bc3f1f9622\\\",\\\"ok\\\":true,\\\"recordUpdated\\\":true,\\\"stagedRemoved\\\":false,\\\"storage\\\":\\\"plain\\\",\\\"stranded\\\":false}\",\"status\":\"ok\"}\n{\"method\":\"remove_wallet\",\"module\":\"keystore_custodian\",\"result\":\"{\\\"error\\\":\\\"this wallet still holds 1 account(s); removing its record would leave them with nothing to name them \u2014 delete them first\\\",\\\"ok\\\":false}\",\"status\":\"ok\"}\n{\"method\":\"delete\",\"module\":\"keystore_custodian\",\"result\":\"{\\\"ok\\\":true}\",\"status\":\"ok\"}\n{\"method\":\"remove_wallet\",\"module\":\"keystore_custodian\",\"result\":\"{\\\"group\\\":\\\"g_19cac975b260bf78ce70c5bc3f1f9622\\\",\\\"nameRemoved\\\":true,\\\"ok\\\":true,\\\"recordRemoved\\\":true}\",\"status\":\"ok\"}\n{\"method\":\"list_groups\",\"module\":\"keystore_module\",\"result\":\"{\\\"addAgain\\\":[],\\\"groups\\\":[{\\\"accountCount\\\":1,\\\"chain\\\":null,\\\"derivable\\\":true,\\\"family\\\":null,\\\"id\\\":\\\"g_c73d10f81d6b3798266c1342ec9bf2c0\\\",\\\"label\\\":\\\"Cold storage\\\",\\\"needsPhrase\\\":false,\\\"nextIndex\\\":2,\\\"pathPrefix\\\":\\\"m/44'/60'/5'\\\",\\\"phrase\\\":null,\\\"preview\\\":null,\\\"retiredIndices\\\":[0],\\\"seedId\\\":\\\"g_8224236fcc61796f71d47949f910181a\\\",\\\"staged\\\":false,\\\"storage\\\":\\\"extkey\\\",\\\"stranded\\\":false,\\\"usedIndices\\\":[1],\\\"usedPassphrase\\\":false,\\\"walletName\\\":null},{\\\"accountCount\\\":1,\\\"chain\\\":null,\\\"derivable\\\":true,\\\"family\\\":null,\\\"id\\\":\\\"g_d4130d5590b460b62328553df9843d24\\\",\\\"label\\\":\\\"Cold storage\\\",\\\"needsPhrase\\\":false,\\\"nextIndex\\\":1,\\\"pathPrefix\\\":\\\"m/44'/60'/0'\\\",\\\"phrase\\\":null,\\\"preview\\\":null,\\\"retiredIndices\\\":[],\\\"seedId\\\":\\\"g_8224236fcc61796f71d47949f910181a\\\",\\\"staged\\\":false,\\\"storage\\\":\\\"extkey\\\",\\\"stranded\\\":false,\\\"usedIndices\\\":[0],\\\"usedPassphrase\\\":false,\\\"walletName\\\":null}],\\\"lockedSeeds\\\":[],\\\"lockedWallets\\\":0,\\\"ok\\\":true}\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 3.21 A wallet with nothing left in it can finally be removed\n\nA wallet is up to four things: a record in `groups.json`, a name in\n`group-labels.json`, a derivation key, and its accounts. `forget_derivation`\nremoves the **key** and reports not-found when there is none \u2014 so a wallet that is\nnot derivable and holds no accounts had only a record, and nothing in this module\ncould take its row off the screen. `remove_group` is that method.\n\nIt removes the record and the name, and it **refuses while the wallet still holds\nanything** \u2014 a derivation key (live or staged) or an account. So it is never a\nsecond door to deleting a key, and because \"holds nothing\" is the precondition it\nneeds no password: there is nothing signable left for one to protect. The ladder\nbelow is the whole cost, and it is the correct cost \u2014 every rung that is refused is\nrefused because a spendable key is still under that row.\n\n```bash\nlogosctl call keystore_custodian name_wallet <g> \"Old phone\" <address> pw3\nlogosctl call keystore_module remove_group '{\"group\":\"<g>\"}'  # refused: Tier D\nlogosctl call keystore_custodian remove_wallet <g>            # refused: it still keeps a key\nlogosctl call keystore_custodian forget <g>\nlogosctl call keystore_custodian remove_wallet <g>            # refused: it still holds an account\nlogosctl call keystore_custodian delete <address> pw3\nlogosctl call keystore_custodian remove_wallet <g>            # the row goes\nlogosctl call keystore_module list_groups\n```"}, {"execs": [{"cmd": "words='test test test test test test test test test test test junk'\nr=$(./logos/bin/logosctl --config-dir ./session call keystore_custodian bitcoin \"{\\\"phrase\\\":\\\"$words\\\",\\\"family\\\":\\\"bitcoin\\\",\\\"chain\\\":\\\"test\\\",\\\"password\\\":\\\"bpw\\\",\\\"keepPhrase\\\":{\\\"password\\\":\\\"ppw\\\"}}\")\necho \"$r\"\np=$(echo \"$r\" | grep -o 'p_[0-9a-f]\\{32\\}' | head -1)\n./logos/bin/logosctl --config-dir ./session call keystore_custodian bitcoin \"{\\\"keptPhrase\\\":\\\"$p\\\",\\\"phrasePassword\\\":\\\"ppw\\\",\\\"family\\\":\\\"bitcoin_taproot\\\",\\\"chain\\\":\\\"test\\\",\\\"password\\\":\\\"bpw\\\"}\"\n./logos/bin/logosctl --config-dir ./session call keystore_custodian evm \"{\\\"keptPhrase\\\":\\\"$p\\\",\\\"phrasePassword\\\":\\\"ppw\\\",\\\"accountIndex\\\":5,\\\"password\\\":\\\"epw\\\"}\"\n./logos/bin/logosctl --config-dir ./session call keystore_module list_phrases\n./logos/bin/logosctl --config-dir ./session call keystore_module show_phrase \"{\\\"phrase\\\":\\\"$p\\\",\\\"password\\\":\\\"ppw\\\"}\"\n./logos/bin/logosctl --config-dir ./session call keystore_custodian phrase \"{\\\"phrase\\\":\\\"$p\\\",\\\"password\\\":\\\"bpw\\\"}\"\n./logos/bin/logosctl --config-dir ./session call keystore_custodian phrase \"{\\\"phrase\\\":\\\"$p\\\",\\\"password\\\":\\\"ppw\\\"}\"\n./logos/bin/logosctl --config-dir ./session call keystore_custodian forget_phrase \"{\\\"phrase\\\":\\\"$p\\\"}\"\n./logos/bin/logosctl --config-dir ./session call keystore_module list_phrases\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"bitcoin\",\"module\":\"keystore_custodian\",\"result\":\"{\\\"birthday\\\":null,\\\"chain\\\":\\\"test\\\",\\\"external\\\":\\\"wpkh([16a93ed0/84'/1'/0']tpubDCTawRj1voCsGHoKQopGdxi1UXEfy8eeogsbA7SxDL1j7tvTfwdF6jQNSneAQw5a2x29XY6PWbnKMx68oM7BYoew8eRySvVaLZxkrBzWr4A/0/*)#a222upy4\\\",\\\"family\\\":\\\"bitcoin\\\",\\\"fingerprint\\\":\\\"16a93ed0\\\",\\\"group\\\":\\\"g_de12572002b45186df5291eff66408c0\\\",\\\"internal\\\":\\\"wpkh([16a93ed0/84'/1'/0']tpubDCTawRj1voCsGHoKQopGdxi1UXEfy8eeogsbA7SxDL1j7tvTfwdF6jQNSneAQw5a2x29XY6PWbnKMx68oM7BYoew8eRySvVaLZxkrBzWr4A/1/*)#v70tp55d\\\",\\\"ok\\\":true,\\\"origin\\\":\\\"restored\\\",\\\"path\\\":\\\"m/84'/1'/0'\\\",\\\"phrase\\\":\\\"p_297e087202af69d3a751c4f278430f0c\\\"}\",\"status\":\"ok\"}\n{\"method\":\"bitcoin\",\"module\":\"keystore_custodian\",\"result\":\"{\\\"birthday\\\":null,\\\"chain\\\":\\\"test\\\",\\\"external\\\":\\\"tr([16a93ed0/86'/1'/0']tpubDCskrZKzrELGaSrUBBLhqaiTMWUpfAvSzDrNzgbNkH7mRGyigwg3Wevzk49UYE1AT8vP93CvBUFy7SqCChRg4EJ4ZNEq1YQsu2QD9eHiryU/0/*)#y7wnm7t0\\\",\\\"family\\\":\\\"bitcoin_taproot\\\",\\\"fingerprint\\\":\\\"16a93ed0\\\",\\\"group\\\":\\\"g_75a5e6d3589754b9ae8ad9988656a4fe\\\",\\\"internal\\\":\\\"tr([16a93ed0/86'/1'/0']tpubDCskrZKzrELGaSrUBBLhqaiTMWUpfAvSzDrNzgbNkH7mRGyigwg3Wevzk49UYE1AT8vP93CvBUFy7SqCChRg4EJ4ZNEq1YQsu2QD9eHiryU/1/*)#42tjxtmh\\\",\\\"ok\\\":true,\\\"origin\\\":\\\"restored\\\",\\\"path\\\":\\\"m/86'/1'/0'\\\",\\\"phrase\\\":\\\"p_297e087202af69d3a751c4f278430f0c\\\"}\",\"status\":\"ok\"}\n{\"method\":\"evm\",\"module\":\"keystore_custodian\",\"result\":\"{\\\"address\\\":\\\"0x9965507D1a55bcC2695C58ba16FB37d819B0A4dc\\\",\\\"group\\\":\\\"g_de880fc4fef406a30a3bff43c781562b\\\",\\\"index\\\":5,\\\"ok\\\":true,\\\"origin\\\":\\\"derived\\\",\\\"path\\\":\\\"m/44'/60'/0'/0/5\\\",\\\"phrase\\\":\\\"p_297e087202af69d3a751c4f278430f0c\\\",\\\"storage\\\":\\\"plain\\\"}\",\"status\":\"ok\"}\n{\"method\":\"list_phrases\",\"module\":\"keystore_module\",\"result\":\"{\\\"ok\\\":true,\\\"phrases\\\":[{\\\"groups\\\":[\\\"g_75a5e6d3589754b9ae8ad9988656a4fe\\\",\\\"g_de12572002b45186df5291eff66408c0\\\",\\\"g_de880fc4fef406a30a3bff43c781562b\\\"],\\\"id\\\":\\\"p_297e087202af69d3a751c4f278430f0c\\\",\\\"staged\\\":false}]}\",\"status\":\"ok\"}\n{\"method\":\"show_phrase\",\"module\":\"keystore_module\",\"result\":\"{\\\"error\\\":\\\"not authorized\\\",\\\"ok\\\":false}\",\"status\":\"ok\"}\n{\"method\":\"phrase\",\"module\":\"keystore_custodian\",\"result\":\"{\\\"error\\\":\\\"the password for this phrase is not correct\\\",\\\"ok\\\":false}\",\"status\":\"ok\"}\n{\"method\":\"phrase\",\"module\":\"keystore_custodian\",\"result\":\"{\\\"ok\\\":true,\\\"phrase\\\":\\\"p_297e087202af69d3a751c4f278430f0c\\\",\\\"words\\\":\\\"test test test test test test test test test test test junk\\\"}\",\"status\":\"ok\"}\n{\"method\":\"forget_phrase\",\"module\":\"keystore_custodian\",\"result\":\"{\\\"forgotten\\\":true,\\\"ok\\\":true}\",\"status\":\"ok\"}\n{\"method\":\"list_phrases\",\"module\":\"keystore_module\",\"result\":\"{\\\"ok\\\":true,\\\"phrases\\\":[]}\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 3.22 Keeping the recovery phrase is the person's choice\n\nOff unless asked for. `keepPhrase` keeps the phrase in a scrypt vault of its own, under\na password of its own, and the wallet names it. More wallets come from the kept phrase\nwithout typing the words again, with that password: a taproot one, and an EVM one at\naddress index 5. The words go to the keys app alone (`show_phrase`, Tier D);\n`forget_phrase` removes the vault with no password, and the wallets made from it stay.\n\n```bash\nlogosctl call keystore_custodian bitcoin '{\"phrase\":\"<words>\",\"family\":\"bitcoin\",\"chain\":\"test\",\"password\":\"bpw\",\"keepPhrase\":{\"password\":\"ppw\"}}'\nlogosctl call keystore_custodian bitcoin '{\"keptPhrase\":\"<p_\u2026>\",\"phrasePassword\":\"ppw\",\"family\":\"bitcoin_taproot\",\"chain\":\"test\",\"password\":\"bpw\"}'\nlogosctl call keystore_custodian evm '{\"keptPhrase\":\"<p_\u2026>\",\"phrasePassword\":\"ppw\",\"accountIndex\":5,\"password\":\"epw\"}'\nlogosctl call keystore_module list_phrases\nlogosctl call keystore_module show_phrase '{\"phrase\":\"<p_\u2026>\",\"password\":\"ppw\"}'     # refused: Tier D\nlogosctl call keystore_custodian phrase '{\"phrase\":\"<p_\u2026>\",\"password\":\"bpw\"}'       # the wallet's password is not the phrase's\nlogosctl call keystore_custodian phrase '{\"phrase\":\"<p_\u2026>\",\"password\":\"ppw\"}'\nlogosctl call keystore_custodian forget_phrase '{\"phrase\":\"<p_\u2026>\"}'\nlogosctl call keystore_module list_phrases\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session call keystore_module caller_identity", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"caller_identity\",\"module\":\"keystore_module\",\"result\":\"{\\\"approvers\\\":[\\\"evm_signer_ui\\\"],\\\"custodians\\\":[\\\"keystore_custodian\\\"],\\\"identity\\\":\\\"\\\",\\\"kind\\\":\\\"host\\\",\\\"managers\\\":[],\\\"ok\\\":true}\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 3.23 Ask the module who it thinks is calling\n\nThe CLI presents a host bootstrap anchor, so the keystore names it\n`host` \u2014 honestly, and without inventing a module name. `core` and\n`capability_module` share one token value under two keys, so an anchor\ncannot be attributed to any particular party. That is the whole reason\nthe next two steps refuse: the caller is named, and is not admitted.\n\n```bash\nlogosctl call keystore_module caller_identity\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session call keystore_module request_approval '{\"address\":\"0x0000000000000000000000000000000000000001\",\"purpose\":\"doc-test\",\"legs\":[{\"kind\":\"message\",\"text\":\"hello-logos\"}]}'", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"request_approval\",\"module\":\"keystore_module\",\"result\":\"{\\\"error\\\":\\\"not authorized\\\",\\\"ok\\\":false}\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 3.24 Request a signature from the CLI \u2014 refused\n\n`request_approval` is Tier B: any **named module** may ask for a\nsignature. The CLI is not a named module, so it cannot even ask.\n\n```bash\nlogosctl call keystore_module request_approval '{...intent...}'\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session call keystore_module pending", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"pending\",\"module\":\"keystore_module\",\"result\":\"{\\\"error\\\":\\\"not authorized\\\",\\\"ok\\\":false}\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 3.25 Approve a signature from the CLI \u2014 refused\n\n`approve` is Tier A: **only** the configured approver (`evm_signer_ui`) may\napprove, and it must be a human doing it. There is no flag, token or\nargument that makes this succeed from a shell \u2014 which is the property\nthis module exists to provide.\n\n```bash\nlogosctl call keystore_module pending\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session daemon stop", "exit_code": 0, "kind": "run", "note": "", "output": "{\"message\":\"Daemon shutting down.\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 3.26 Stop the daemon\n\n```bash\nlogosctl daemon stop\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session daemon status || true", "exit_code": 0, "kind": "run", "note": "", "output": "{\"daemon\":{\"reason\":\"No daemon running (no local endpoint at /var/folders/n6/hn37q6pj7sj_9dmqqc2113800000gn/T/logos_core_service_048e33d309a2). A daemon that stopped removes it; start one in this session to get it back.\",\"status\":\"not_running\"}}\n", "status": "pass"}], "md": "### 3.27 Confirm the daemon has stopped\n\n```bash\nlogosctl daemon status\n```"}]}], "version": 1}</script>
<script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.platform ? " · " + e.platform : ""}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    if (e.runner_cmd) h += `<pre class="cmd">${escapeHtml(e.runner_cmd)}</pre>`;
    if (e.actions) {
      const passed = e.actions.filter(a => a.status === "pass").length;
      h += `<div class="kind">UI actions: ${passed}/${e.actions.length} passed</div>`;
      h += `<table class="ui-actions"><tbody>`;
      for (const a of e.actions) {
        const label = a.status === "not_run" ? "NOT RUN" :
          a.status === "running" ? "INTERRUPTED" : a.status.toUpperCase();
        h += `<tr><td>${a.index}</td><td><span class="badge ${a.status}">${label}</span></td>`;
        h += `<td>${escapeHtml(a.description)}`;
        if (a.error) h += `<div class="note">${escapeHtml(a.error)}</div>`;
        h += `</td><td>${a.duration_ms !== undefined ? a.duration_ms + " ms" : ""}</td></tr>`;
      }
      h += `</tbody></table>`;
    }
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });

    addAnchors(main, slug(t.meta.name));
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }

  // Octicon "link" — the same glyph GitHub puts next to markdown headings.
  const LINK_ICON =
    '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d=' +
    '"M7.775 3.275a.75.75 0 0 0 1.06 1.06l1.25-1.25a2 2 0 1 1 2.83 2.83l-2.5 2.5a2 2 0 0 1-2.83 0 ' +
    '.75.75 0 0 0-1.06 1.06 3.5 3.5 0 0 0 4.95 0l2.5-2.5a3.5 3.5 0 0 0-4.95-4.95l-1.25 1.25Zm-4.69 ' +
    '9.64a2 2 0 0 1 0-2.83l2.5-2.5a2 2 0 0 1 2.83 0 .75.75 0 0 0 1.06-1.06 3.5 3.5 0 0 0-4.95 0l-2.5 ' +
    '2.5a3.5 3.5 0 0 0 4.95 4.95l1.25-1.25a.75.75 0 0 0-1.06-1.06l-1.25 1.25a2 2 0 0 1-2.83 0Z"></path></svg>';

  // Give every heading a stable slug id (deduplicated the way GitHub does, with
  // -1/-2 suffixes) and a permalink whose href is "#<tutorial>/<heading>".
  function addAnchors(container, tutSlug) {
    const used = new Map();
    const nodes = container.querySelectorAll(
      ".tutorial-title, .md h1, .md h2, .md h3, .md h4, .md h5, .md h6"
    );
    nodes.forEach(node => {
      const text = node.textContent.trim();
      const isTitle = node.classList.contains("tutorial-title");
      let href = "#" + tutSlug;
      if (!isTitle) {
        const base = slug(text) || "section";
        const n = (used.get(base) || 0) + 1;
        used.set(base, n);
        node.id = n > 1 ? base + "-" + n : base;
        href += "/" + node.id;
      }
      node.classList.add("heading-anchored");
      const a = document.createElement("a");
      a.className = "anchor";
      a.href = href;
      a.title = "Copy link to this section";
      a.setAttribute("aria-label", "Permalink: " + text);
      a.innerHTML = LINK_ICON;
      node.insertBefore(a, node.firstChild);
    });
  }

  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
  }

  // navigator.clipboard needs a secure context; reports are often opened over
  // file://, so fall back to the old execCommand path there.
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(
        () => toast("Link copied"),
        () => toast(text)
      );
      return;
    }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? "Link copied" : text);
  }

  function scrollToId(id) {
    if (!id) { window.scrollTo(0, 0); return; }
    const el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ block: "start" });
    el.classList.remove("flash");
    void el.offsetWidth;  // restart the animation on a repeat click
    el.classList.add("flash");
  }

  document.addEventListener("click", ev => {
    const a = ev.target.closest && ev.target.closest("a.anchor");
    if (!a) return;
    ev.preventDefault();
    const href = a.getAttribute("href");
    copyText(location.href.split("#")[0] + href);
    if (location.hash === href) scrollToId(a.parentNode.id);
    else location.hash = href;  // hashchange scrolls
  });

  // "#<tutorial>" (name, slug, or index) optionally followed by "/<heading>".
  function parseHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return { idx: 0, frag: "" };
    const cut = raw.indexOf("/");
    const tut = cut >= 0 ? raw.slice(0, cut) : raw;
    const frag = cut >= 0 ? raw.slice(cut + 1) : "";
    if (/^\d+$/.test(tut) && +tut < DATA.tutorials.length) return { idx: +tut, frag };
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === tut || t.meta.name === tut
    );
    if (i >= 0) return { idx: i, frag };
    // No tutorial matched: treat a bare hash as a heading in the current one.
    return { idx: currentIdx >= 0 ? currentIdx : 0, frag: cut >= 0 ? frag : raw };
  }

  let currentIdx = -1;
  function show(idx, frag) {
    if (idx !== currentIdx) {
      picker.value = idx;
      render(idx);
      currentIdx = idx;
    }
    if (frag) requestAnimationFrame(() => scrollToId(frag));
  }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    show(+picker.value);
  });
  window.addEventListener("hashchange", () => {
    const h = parseHash();
    show(h.idx, h.frag);
  });
  const initial = parseHash();
  show(initial.idx, initial.frag);
  // Inlined screenshots have no intrinsic size until decoded, so the first
  // scroll can land short; re-anchor once everything has loaded.
  if (initial.frag) {
    window.addEventListener("load", () => scrollToId(initial.frag), { once: true });
  }
</script>
</body>
</html>
