/lgpm --modules-dir ./modules list", "exit_code": 0, "kind": "run", "note": "", "output": "Found 3 installed module(s):\n\nNAME                           VERSION         TYPE       CATEGORY       \n----------------------------------------------------------------------\ncapability_module              1.0.0           core       security       \nkeystore_module                1.0.0           core       wallet         \nmodules_state                  0.1.0           core       system         \n", "status": "pass"}], "md": "### 2.4 Confirm the install\n\n```bash\n./lgpm/bin/lgpm --modules-dir ./modules list\n```"}, {"execs": [], "md": "## Step 3: Run the daemon and drive the keystore\n\nStart `logoscore` pointed at `./modules`, load the module, and call it. We\nuse Foundry's well-known test key (account 0,\n`0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266`). Note that `logoscore`'s `call`\nauto-types a `0x\u2026` argument as a number, so addresses are passed as **bare\nhex** \u2014 the keystore accepts either form."}, {"execs": [{"cmd": "sh -c './logos/bin/logoscore -D -m ./modules > logs.txt 2>&1 &'", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "### 3.1 Start the daemon\n\n```bash\nlogoscore -D -m ./modules > logs.txt &\n```"}, {"execs": [{"cmd": "sleep 3", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "```bash\nsleep 3\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore load-module keystore_module", "exit_code": 0, "kind": "run", "note": "", "output": "{\"dependencies_loaded\":[],\"module\":\"keystore_module\",\"status\":\"ok\",\"version\":\"1.0.0\"}\n", "status": "pass"}], "md": "### 3.2 Load the module\n\n```bash\nlogoscore load-module keystore_module\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore module-info keystore_module", "exit_code": 0, "kind": "run", "note": "", "output": "{\"dependencies\":[],\"dependents\":[],\"events\":[{\"name\":\"accounts_changed\",\"parameters\":[{\"name\":\"count\", ":[{\"name\":\"handle\",\"type\":\"QString\"}],\"returnType\":\"bool\",\"signature\":\"reject(QString)\"},{\"isInvokable\":true,\"name\":\"caller_identity\",\"returnType\":\"QString\",\"signature\":\"caller_identity()\"},{\"isInvokable\":true,\"name\":\"name\",\"returnType\":\"QString\",\"signature\":\"name()\"},{\"isInvokable\":true,\"name\":\"version\",\"returnType\":\"QString\",\"signature\":\"version()\"}],\"name\":\"keystore_module\",\"status\":\"loaded\",\"uptime_seconds\":0,\"version\":\"1.0.0\"}\n", "status": "pass"}], "md": "### 3.3 Introspect the module\n\n```bash\nlogoscore module-info keystore_module\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore call keystore_module create_mnemonic 12", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"create_mnemonic\",\"module\":\"keystore_module\",\"result\":\"{\\\"ok\\\":true,\\\"phrase\\\":\\\"pioneer ensure elbow flip rubber ankle flower fuel car into lawn shift\\\"}\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 3.4 Generate a BIP-39 mnemonic\n\n```bash\nlogoscore call keystore_module create_mnemonic 12\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore call keystore_module import_private_key ac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80 pw", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"import_private_key\",\"module\":\"keystore_module\",\"result\":\"{\\\"address\\\":\\\"0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266\\\",\\\"ok\\\":true}\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 3.5 Import a known private key\n\nImport Foundry's account-0 private key under a passphrase. The module\nreturns only the **address** \u2014 the key stays inside the scrypt vault.\n\n```bash\nlogoscore call keystore_module import_private_key <privkey> pw\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore call keystore_module list_accounts", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"list_accounts\",\"module\":\"keystore_module\",\"result\":\"{\\\"accounts\\\":[\\\"0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266\\\"],\\\"ok\\\":true}\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 3.6 List accounts\n\n```bash\nlogoscore call keystore_module list_accounts\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore call keystore_module caller_identity", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"caller_identity\",\"module\":\"keystore_module\",\"result\":\"{\\\"approver\\\":\\\"signer_ui\\\",\\\"identity\\\":\\\"\\\",\\\"kind\\\":\\\"host\\\",\\\"ok\\\":true}\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 3.7 Ask the module who it thinks is calling\n\nThe CLI presents a host bootstrap anchor, so the keystore names it\n`host` \u2014 honestly, and without inventing a module name. `core` and\n`capability_module` share one token value under two keys, so an anchor\ncannot be attributed to any particular party. That is the whole reason\nthe next two steps refuse: the caller is named, and is not admitted.\n\n```bash\nlogoscore call keystore_module caller_identity\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore call keystore_module request_approval '{\"address\":\"0x0000000000000000000000000000000000000001\",\"purpose\":\"doc-test\",\"legs\":[{\"kind\":\"message\",\"text\":\"hello-logos\"}]}'", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"request_approval\",\"module\":\"keystore_module\",\"result\":\"{\\\"error\\\":\\\"not authorized\\\",\\\"ok\\\":false}\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 3.8 Request a signature from the CLI \u2014 refused\n\n`request_approval` is Tier B: any **named module** may ask for a\nsignature. The CLI is not a named module, so it cannot even ask.\n\n```bash\nlogoscore call keystore_module request_approval '{...intent...}'\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore call keystore_module pending", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"pending\",\"module\":\"keystore_module\",\"result\":\"{\\\"error\\\":\\\"not authorized\\\",\\\"ok\\\":false}\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 3.9 Approve a signature from the CLI \u2014 refused\n\n`approve` is Tier A: **only** the configured approver (`signer_ui`) may\napprove, and it must be a human doing it. There is no flag, token or\nargument that makes this succeed from a shell \u2014 which is the property\nthis module exists to provide.\n\n```bash\nlogoscore call keystore_module pending\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore stop", "exit_code": 0, "kind": "run", "note": "", "output": "{\"message\":\"Daemon shutting down.\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 3.10 Stop the daemon\n\n```bash\nlogoscore stop\n```"}, {"execs": [{"cmd": "sleep 2", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "```bash\nsleep 2\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore status || true", "exit_code": 0, "kind": "run", "note": "", "output": "{\"daemon\":{\"reason\":\"No daemon running (no local endpoint at /home/runner/work/_temp/logos_core_service_279f3486868b). A daemon that stopped removes it; start one in this session to get it back.\",\"status\":\"not_running\"}}\n", "status": "pass"}], "md": "### 3.11 Confirm the daemon has stopped\n\n```bash\nlogoscore status\n```"}]}], "version": 1}</script>
<script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.platform ? " · " + e.platform : ""}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });

    addAnchors(main, slug(t.meta.name));
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }

  // Octicon "link" — the same glyph GitHub puts next to markdown headings.
  const LINK_ICON =
    '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d=' +
    '"M7.775 3.275a.75.75 0 0 0 1.06 1.06l1.25-1.25a2 2 0 1 1 2.83 2.83l-2.5 2.5a2 2 0 0 1-2.83 0 ' +
    '.75.75 0 0 0-1.06 1.06 3.5 3.5 0 0 0 4.95 0l2.5-2.5a3.5 3.5 0 0 0-4.95-4.95l-1.25 1.25Zm-4.69 ' +
    '9.64a2 2 0 0 1 0-2.83l2.5-2.5a2 2 0 0 1 2.83 0 .75.75 0 0 0 1.06-1.06 3.5 3.5 0 0 0-4.95 0l-2.5 ' +
    '2.5a3.5 3.5 0 0 0 4.95 4.95l1.25-1.25a.75.75 0 0 0-1.06-1.06l-1.25 1.25a2 2 0 0 1-2.83 0Z"></path></svg>';

  // Give every heading a stable slug id (deduplicated the way GitHub does, with
  // -1/-2 suffixes) and a permalink whose href is "#<tutorial>/<heading>".
  function addAnchors(container, tutSlug) {
    const used = new Map();
    const nodes = container.querySelectorAll(
      ".tutorial-title, .md h1, .md h2, .md h3, .md h4, .md h5, .md h6"
    );
    nodes.forEach(node => {
      const text = node.textContent.trim();
      const isTitle = node.classList.contains("tutorial-title");
      let href = "#" + tutSlug;
      if (!isTitle) {
        const base = slug(text) || "section";
        const n = (used.get(base) || 0) + 1;
        used.set(base, n);
        node.id = n > 1 ? base + "-" + n : base;
        href += "/" + node.id;
      }
      node.classList.add("heading-anchored");
      const a = document.createElement("a");
      a.className = "anchor";
      a.href = href;
      a.title = "Copy link to this section";
      a.setAttribute("aria-label", "Permalink: " + text);
      a.innerHTML = LINK_ICON;
      node.insertBefore(a, node.firstChild);
    });
  }

  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
  }

  // navigator.clipboard needs a secure context; reports are often opened over
  // file://, so fall back to the old execCommand path there.
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(
        () => toast("Link copied"),
        () => toast(text)
      );
      return;
    }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? "Link copied" : text);
  }

  function scrollToId(id) {
    if (!id) { window.scrollTo(0, 0); return; }
    const el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ block: "start" });
    el.classList.remove("flash");
    void el.offsetWidth;  // restart the animation on a repeat click
    el.classList.add("flash");
  }

  document.addEventListener("click", ev => {
    const a = ev.target.closest && ev.target.closest("a.anchor");
    if (!a) return;
    ev.preventDefault();
    const href = a.getAttribute("href");
    copyText(location.href.split("#")[0] + href);
    if (location.hash === href) scrollToId(a.parentNode.id);
    else location.hash = href;  // hashchange scrolls
  });

  // "#<tutorial>" (name, slug, or index) optionally followed by "/<heading>".
  function parseHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return { idx: 0, frag: "" };
    const cut = raw.indexOf("/");
    const tut = cut >= 0 ? raw.slice(0, cut) : raw;
    const frag = cut >= 0 ? raw.slice(cut + 1) : "";
    if (/^\d+$/.test(tut) && +tut < DATA.tutorials.length) return { idx: +tut, frag };
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === tut || t.meta.name === tut
    );
    if (i >= 0) return { idx: i, frag };
    // No tutorial matched: treat a bare hash as a heading in the current one.
    return { idx: currentIdx >= 0 ? currentIdx : 0, frag: cut >= 0 ? frag : raw };
  }

  let currentIdx = -1;
  function show(idx, frag) {
    if (idx !== currentIdx) {
      picker.value = idx;
      render(idx);
      currentIdx = idx;
    }
    if (frag) requestAnimationFrame(() => scrollToId(frag));
  }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    show(+picker.value);
  });
  window.addEventListener("hashchange", () => {
    const h = parseHash();
    show(h.idx, h.frag);
  });
  const initial = parseHash();
  show(initial.idx, initial.frag);
  // Inlined screenshots have no intrinsic size until decoded, so the first
  // scroll can land short; re-anchor once everything has loaded.
  if (initial.frag) {
    window.addEventListener("load", () => scrollToId(initial.frag), { once: true });
  }
</script>
</body>
</html>
