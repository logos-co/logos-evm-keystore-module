name: "Running the Keystore Module Against logoscore"
output: keystore-module-runtime.md
release: ""

intro: |
  `logos-evm-keystore-module` is the keystore for the Logos multi-chain EVM
  wallet: scrypt-encrypted vaults, BIP39/BIP32 HD derivation, and secp256k1
  signing, built on [`alloy`](https://github.com/alloy-rs/alloy) and
  [`eth-keystore`](https://crates.io/crates/eth-keystore). It does **no
  networking** and private keys never cross the module boundary.

  This doc-test exercises the module end-to-end through the headless `logoscore`
  runtime — every step is **offline and deterministic**, so it needs no network
  and reproduces in CI:

  1. Build `logoscore` and `lgpm` from their published flakes.
  2. Build this module's installable `.lgx` from its `#lgx` output.
  3. Install it into a `./modules` directory with `lgpm`.
  4. Start a `logoscore` daemon, load `keystore_module`, and drive it: generate a
     mnemonic, import a known private key, and then **demonstrate that the CLI
     cannot make it sign anything** — signing requires a human approving through
     the dedicated signer UI.

what_you_build: "This `keystore_module`, packaged as `.lgx`, installed with `lgpm`, and called through a `logoscore` daemon."

what_you_learn:
  - How a Rust (rust-first cdylib) Logos module is packaged as an installable `.lgx`
  - How to install it with `lgpm` and load it into a `logoscore` daemon
  - Why a signature cannot be obtained from the CLI, and what refuses it
  - How the keystore keeps private keys inside the module (only addresses and signed payloads come out)

prerequisites:
  - |
    **Nix** with flakes enabled. Install from [nixos.org](https://nixos.org/download.html), then enable flakes:

    ```bash
    mkdir -p ~/.config/nix
    echo 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf
    ```

    Verify: `nix flake --help >/dev/null 2>&1 && echo "Flakes enabled"`
  - "**A Linux or macOS machine.** Everything here is offline."

sections:
  - title: "Build logoscore and lgpm"
    step: true
    text: |
      `logoscore` is the headless frontend for `logos-liblogos` (it brings in the
      whole module-runtime stack), and `lgpm` installs `.lgx` packages into a
      modules directory.
    steps:
      - title: "Build logoscore"
        run: "nix build 'github:logos-co/logos-logoscore-cli#cli' --out-link ./logos"
        check_file: "logos/bin/logoscore"
      - title: "Prove the CLI actually runs"
        run: "./logos/bin/logoscore --version"
        code_block: "logoscore --version"
        # A positive control, not decoration. `check_file` did NOT fail when this
        # path was wrong: the step reported PASS while every later command died
        # with exit 127 ("No such file or directory"). Actually RUNNING the
        # binary is the only assertion here that cannot pass on a tree where it
        # is missing.
        expect_contains:
          - "logoscore version"

      - title: "Build lgpm"
        run: "nix build 'github:logos-co/logos-package-manager#cli' -o lgpm"
        check_file: "lgpm/bin/lgpm"

  - title: "Build and install the keystore module"
    step: true
    text: |
      Build this module's `.lgx` from its flake's `#lgx` output and install it
      into a local `./modules` directory. The bundled `capability_module` (shipped
      with `logoscore`) handles the load-time auth handshake, so seed it first.
    steps:
      - title: "Build the module's .lgx"
        run: "nix build 'github:logos-co/logos-evm-keystore-module{release}#lgx' --no-write-lock-file -o keystore-lgx"
        code_block: |
          # From inside the clone this is simply: nix build '.#lgx'
          nix build 'github:logos-co/logos-evm-keystore-module{release}#lgx' -o keystore-lgx
        extra_run:
          run: "ls keystore-lgx/*.lgx"
      - title: "Seed the capability module"
        run: |
          mkdir -p modules
          cp -RL ./logos/modules/. ./modules/
        check_file: "modules/capability_module/manifest.json"
      - title: "Install the .lgx with lgpm"
        run: "./lgpm/bin/lgpm --modules-dir ./modules --allow-unsigned install --file keystore-lgx/*.lgx"
        expect_contains:
          - "Installed to:"
      - title: "Build the custodian fixture"
        text: |
          Account mutation is gated on a configured **custodian**. In production that is
          `keystore_ui`; here it is a small fixture module, so the gate can be exercised
          from both sides headlessly. A fixture is a real caller with a real name — the
          gate does not care what a module is *for*.
        run: "nix build ./doctests/custodian-probe#lgx-portable -o custodian-lgx"
        code_block: "nix build ./doctests/custodian-probe#lgx-portable -o custodian-lgx"
        check_file: "custodian-lgx"
      - title: "Install both"
        run: "./lgpm/bin/lgpm --modules-dir ./modules --allow-unsigned install --file custodian-lgx/*.lgx"
        expect_contains:
          - "Installed to:"
      - title: "Confirm the install"
        run: "./lgpm/bin/lgpm --modules-dir ./modules list"
        expect_contains:
          - "keystore_module"
          - "keystore_custodian"
        check_file: "modules/keystore_module/manifest.json"

  - title: "Run the daemon and drive the keystore"
    step: true
    text: |
      Start `logoscore` pointed at `./modules`, load the module, and call it. We
      use Foundry's well-known test key (account 0,
      `0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266`). Note that `logoscore`'s `call`
      auto-types a `0x…` argument as a number, so addresses are passed as **bare
      hex** — the keystore accepts either form.
    steps:
      - title: "Start the daemon once, so the module data directory exists"
        run: "sh -c './logos/bin/logoscore -D -m ./modules > logs.txt 2>&1 &'"
        code_block: "logoscore -D -m ./modules > logs.txt &"
      - run: "sleep 3"
      - title: "Load the module"
        run: "./logos/bin/logoscore load-module keystore_module"
      - run: "sleep 1 && ./logos/bin/logoscore stop || true"
      - title: "Name the custodian"
        text: |
          Who may mutate the keystore is **configuration, not a method**: a `set_custodian`
          call would be a remotely-writable answer to "who may import a key". The file is
          written by whoever deploys the module, and the module reads it once at startup.

          The path is instance-hashed, hence the glob.
        run: |
          d=$(find . -type d -path '*module_data/keystore_module/*' | head -1)
          mkdir -p "$d"
          printf '{"approver":"signer_ui","custodian":"keystore_custodian"}\n' > "$d/keystore.json"
          cat "$d/keystore.json"
        code_block: "echo '{\"custodian\":\"keystore_custodian\"}' > <module-data>/keystore.json"
        expect_contains:
          - "keystore_custodian"
      - title: "Restart with the custodian configured"
        run: "sh -c './logos/bin/logoscore -D -m ./modules > logs.txt 2>&1 &'"
      - run: "sleep 3"
      - title: "Load the module"
        run: "./logos/bin/logoscore load-module keystore_module"
        code_block: "logoscore load-module keystore_module"
        expect_contains:
          - "keystore_module"
      - title: "Introspect the module"
        run: "./logos/bin/logoscore module-info keystore_module"
        code_block: "logoscore module-info keystore_module"
        expect_contains:
          - "request_approval"
          - "caller_identity"
      - title: "Load the custodian fixture"
        run: "./logos/bin/logoscore load-module keystore_custodian"
        expect_contains:
          - "keystore_custodian"
      - title: "The CLI cannot mutate the keystore"
        text: |
          The CLI authenticates as the **host anchor** — one undifferentiated bag covering
          the shells and every relayed token. Admitting it would make `logoscore call` a
          legal way to import a key, so Tier D refuses it. The refusal string is identical
          to Tier A's and Tier B's, so a caller cannot use the error text to work out which
          tier it failed.
        run: |
          ./logos/bin/logoscore call keystore_module create_mnemonic 12
          ./logos/bin/logoscore call keystore_module import_private_key ac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80 pw
        code_block: "logoscore call keystore_module import_private_key <privkey> pw"
        expect_contains:
          - "not authorized"
      - title: "…but the ungated reads still work"
        text: |
          The gate closed account *mutation*, not the module. A wallet must still be able to
          show which accounts exist — that is exactly the line Tier D draws.
        run: "./logos/bin/logoscore call keystore_module list_accounts"
        code_block: "logoscore call keystore_module list_accounts"
        expect_contains:
          - "ok"
      - title: "Generate a BIP-39 mnemonic, through the custodian"
        run: "./logos/bin/logoscore call keystore_custodian identity"
        code_block: "logoscore call keystore_custodian identity"
        expect_contains:
          - "phrase"
      - title: "Import a known private key"
        text: |
          Import Foundry's account-0 private key under a passphrase. The module
          returns only the **address** — the key stays inside the scrypt vault.
        run: "./logos/bin/logoscore call keystore_custodian import_key ac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80 pw"
        code_block: "logoscore call keystore_custodian import_key <privkey> pw"
        expect_contains:
          - "f39Fd6e51aad88F6F4ce6aB8827279cffFb92266"
      - title: "List accounts"
        run: "./logos/bin/logoscore call keystore_module list_accounts"
        code_block: "logoscore call keystore_module list_accounts"
        expect_contains:
          - "f39Fd6e51aad88F6F4ce6aB8827279cffFb92266"
      - title: "Ask the module who it thinks is calling"
        text: |
          The CLI presents a host bootstrap anchor, so the keystore names it
          `host` — honestly, and without inventing a module name. `core` and
          `capability_module` share one token value under two keys, so an anchor
          cannot be attributed to any particular party. That is the whole reason
          the next two steps refuse: the caller is named, and is not admitted.
        run: "./logos/bin/logoscore call keystore_module caller_identity"
        code_block: "logoscore call keystore_module caller_identity"
        expect_contains:
          - "host"
      - title: "Request a signature from the CLI — refused"
        text: |
          `request_approval` is Tier B: any **named module** may ask for a
          signature. The CLI is not a named module, so it cannot even ask.
        run: "./logos/bin/logoscore call keystore_module request_approval '{\"address\":\"0x0000000000000000000000000000000000000001\",\"purpose\":\"doc-test\",\"legs\":[{\"kind\":\"message\",\"text\":\"hello-logos\"}]}'"
        code_block: "logoscore call keystore_module request_approval '{...intent...}'"
        expect_contains:
          - "not authorized"
      - title: "Approve a signature from the CLI — refused"
        text: |
          `approve` is Tier A: **only** the configured approver (`signer_ui`) may
          approve, and it must be a human doing it. There is no flag, token or
          argument that makes this succeed from a shell — which is the property
          this module exists to provide.
        run: "./logos/bin/logoscore call keystore_module pending"
        code_block: "logoscore call keystore_module pending"
        expect_contains:
          - "not authorized"
      - title: "Stop the daemon"
        run: "./logos/bin/logoscore stop"
        code_block: "logoscore stop"
      - run: "sleep 2"
      - title: "Confirm the daemon has stopped"
        run: "./logos/bin/logoscore status || true"
        code_block: "logoscore status"
        expect_contains:
          - '"status":"not_running"'
