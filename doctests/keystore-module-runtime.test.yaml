name: "Running the Keystore Module Against logoscore"
output: keystore-module-runtime.md
release: ""

intro: |
  `logos-evm-keystore-module` is the keystore for the Logos multi-chain EVM
  wallet: scrypt-encrypted vaults, BIP39/BIP32 HD derivation, and secp256k1
  signing, built on [`alloy`](https://github.com/alloy-rs/alloy) and
  [`eth-keystore`](https://crates.io/crates/eth-keystore). It does **no
  networking** and private keys never cross the module boundary.

  This doc-test exercises the module end-to-end through the headless `logoscore`
  runtime — every step is **offline and deterministic**, so it needs no network
  and reproduces in CI:

  1. Build `logoscore` and `lgpm` from their published flakes.
  2. Build this module's installable `.lgx` from its `#lgx` output.
  3. Install it into a `./modules` directory with `lgpm`.
  4. Start a `logoscore` daemon, load `keystore_module`, and drive it: generate a
     mnemonic, import a known private key, and then **demonstrate that the CLI
     cannot make it sign anything** — signing requires a human approving through
     the dedicated signer UI.

what_you_build: "This `keystore_module`, packaged as `.lgx`, installed with `lgpm`, and called through a `logoscore` daemon."

what_you_learn:
  - How a Rust (rust-first cdylib) Logos module is packaged as an installable `.lgx`
  - How to install it with `lgpm` and load it into a `logoscore` daemon
  - Why a signature cannot be obtained from the CLI, and what refuses it
  - How the keystore keeps private keys inside the module (only addresses and signed payloads come out)

prerequisites:
  - |
    **Nix** with flakes enabled. Install from [nixos.org](https://nixos.org/download.html), then enable flakes:

    ```bash
    mkdir -p ~/.config/nix
    echo 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf
    ```

    Verify: `nix flake --help >/dev/null 2>&1 && echo "Flakes enabled"`
  - "**A Linux or macOS machine.** Everything here is offline."

sections:
  - title: "Build logoscore and lgpm"
    step: true
    text: |
      `logoscore` is the headless frontend for `logos-liblogos` (it brings in the
      whole module-runtime stack), and `lgpm` installs `.lgx` packages into a
      modules directory.
    steps:
      - title: "Build logoscore"
        run: "nix build 'github:logos-co/logos-logoscore-cli#cli' --out-link ./logos"
        check_file: "logos/bin/logoscore"
      - title: "Prove the CLI actually runs"
        run: "./logos/bin/logoscore --version"
        code_block: "logoscore --version"
        # A positive control, not decoration. `check_file` did NOT fail when this
        # path was wrong: the step reported PASS while every later command died
        # with exit 127 ("No such file or directory"). Actually RUNNING the
        # binary is the only assertion here that cannot pass on a tree where it
        # is missing.
        expect_contains:
          - "logoscore version"

      - title: "Build lgpm"
        run: "nix build 'github:logos-co/logos-package-manager#cli' -o lgpm"
        check_file: "lgpm/bin/lgpm"

  - title: "Build and install the keystore module"
    step: true
    text: |
      Build this module's `.lgx` from its flake's `#lgx` output and install it
      into a local `./modules` directory. The bundled `capability_module` (shipped
      with `logoscore`) handles the load-time auth handshake, so seed it first.
    steps:
      - title: "Build the module's .lgx"
        run: "nix build 'github:logos-co/logos-evm-keystore-module{release}#lgx' --no-write-lock-file -o keystore-lgx"
        code_block: |
          # From inside the clone this is simply: nix build '.#lgx'
          nix build 'github:logos-co/logos-evm-keystore-module{release}#lgx' -o keystore-lgx
        extra_run:
          run: "ls keystore-lgx/*.lgx"
      - title: "Seed the capability module"
        run: |
          mkdir -p modules
          cp -RL ./logos/modules/. ./modules/
        check_file: "modules/capability_module/manifest.json"
      - title: "Install the .lgx with lgpm"
        run: "./lgpm/bin/lgpm --modules-dir ./modules --allow-unsigned install --file keystore-lgx/*.lgx"
        expect_contains:
          - "Installed to:"
      - title: "Build the custodian fixture"
        text: |
          Account mutation is gated on a configured **custodian**. In production that is
          `keystore_ui`; here it is a small fixture module, so the gate can be exercised
          from both sides headlessly. A fixture is a real caller with a real name — the
          gate does not care what a module is *for*.
        # The harness runs each spec in an isolated temp dir with no repo in it, so a
        # relative path finds nothing: the fixture is reached as a subflake of the commit
        # under test. Its own flake pins keystore_module to the default branch, which has
        # none of the Tier D surface this fixture calls — hence the override.
        # `#lgx`, not `#lgx-portable`, for the same reason the module above uses it: the
        # portable output carries a bundled `linux-amd64` variant, and this lgpm is the dev
        # build, which installs `linux-x86_64-dev`.
        run: "nix build 'github:logos-co/logos-evm-keystore-module{release}?dir=doctests/custodian-probe#lgx' --override-input keystore_module 'github:logos-co/logos-evm-keystore-module{release}' --no-write-lock-file -o custodian-lgx"
        code_block: |
          # From inside the clone this is simply:
          nix build './doctests/custodian-probe#lgx' -o custodian-lgx
        check_file: "custodian-lgx"
      - title: "Install both"
        run: "./lgpm/bin/lgpm --modules-dir ./modules --allow-unsigned install --file custodian-lgx/*.lgx"
        expect_contains:
          - "Installed to:"
      - title: "Confirm the install"
        run: "./lgpm/bin/lgpm --modules-dir ./modules list"
        expect_contains:
          - "keystore_module"
          - "keystore_custodian"
        check_file: "modules/keystore_module/manifest.json"

  - title: "Run the daemon and drive the keystore"
    step: true
    text: |
      Start `logoscore` pointed at `./modules`, load the module, and call it. We
      use Foundry's well-known test key (account 0,
      `0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266`). Note that `logoscore`'s `call`
      auto-types a `0x…` argument as a number, so addresses are passed as **bare
      hex** — the keystore accepts either form.
    steps:
      - title: "Start the daemon once, so the module data directory exists"
        run: "sh -c './logos/bin/logoscore -D -m ./modules > logs.txt 2>&1 &'"
        code_block: "logoscore -D -m ./modules > logs.txt &"
      - run: "sleep 3"
      - title: "Load the module"
        run: "./logos/bin/logoscore load-module keystore_module"
      - run: "sleep 1 && ./logos/bin/logoscore stop || true"
      - title: "Name the custodian"
        text: |
          Who may mutate the keystore is **configuration, not a method**: a `set_custodian`
          call would be a remotely-writable answer to "who may import a key". The file is
          written by whoever deploys the module, and the module reads it once at startup.

          The path is instance-hashed, hence the glob.
        run: |
          d=$(find . -type d -path '*module_data/keystore_module/*' | head -1)
          mkdir -p "$d"
          printf '{"approver":"signer_ui","custodian":"keystore_custodian"}\n' > "$d/keystore.json"
          cat "$d/keystore.json"
        code_block: "echo '{\"custodian\":\"keystore_custodian\"}' > <module-data>/keystore.json"
        expect_contains:
          - "keystore_custodian"
      - title: "Restart with the custodian configured"
        run: "sh -c './logos/bin/logoscore -D -m ./modules > logs.txt 2>&1 &'"
      - run: "sleep 3"
      - title: "Load the module"
        run: "./logos/bin/logoscore load-module keystore_module"
        code_block: "logoscore load-module keystore_module"
        expect_contains:
          - "keystore_module"
      - title: "Introspect the module"
        run: "./logos/bin/logoscore module-info keystore_module"
        code_block: "logoscore module-info keystore_module"
        expect_contains:
          - "request_approval"
          - "caller_identity"
      - title: "Load the custodian fixture"
        run: "./logos/bin/logoscore load-module keystore_custodian"
        expect_contains:
          - "keystore_custodian"
      - title: "The CLI cannot mutate the keystore"
        text: |
          The CLI authenticates as the **host anchor** — one undifferentiated bag covering
          the shells and every relayed token. Admitting it would make `logoscore call` a
          legal way to import a key, so Tier D refuses it. The refusal string is identical
          to Tier A's and Tier B's, so a caller cannot use the error text to work out which
          tier it failed.
        run: |
          ./logos/bin/logoscore call keystore_module create_mnemonic 12
          ./logos/bin/logoscore call keystore_module import_private_key ac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80 pw
        code_block: "logoscore call keystore_module import_private_key <privkey> pw"
        expect_contains:
          - "not authorized"
      - title: "…and it cannot derive an account either"
        text: |
          HD derivation is account mutation, so it sits behind the same gate. It also opens a
          vault whose blast radius is a whole wallet rather than one account — an `extkey`
          group's stored key reaches every address under one BIP-44 account, past and future.
          The refusal is byte-identical to the one above.
        run: "./logos/bin/logoscore call keystore_module derive_next_account '{\"groupPassword\":\"gp\",\"password\":\"pw\"}'"
        code_block: "logoscore call keystore_module derive_next_account '{\"groupPassword\":\"gp\",\"password\":\"pw\"}'"
        expect_contains:
          - "not authorized"
      - title: "…but the ungated reads still work"
        text: |
          The gate closed account *mutation*, not the module. A wallet must still be able to
          show which accounts exist — that is exactly the line Tier D draws.
        run: "./logos/bin/logoscore call keystore_module list_accounts"
        code_block: "logoscore call keystore_module list_accounts"
        expect_contains:
          - "ok"
      - title: "Generate a BIP-39 mnemonic, through the custodian"
        run: "./logos/bin/logoscore call keystore_custodian identity"
        code_block: "logoscore call keystore_custodian identity"
        expect_contains:
          - "phrase"
      - title: "Import a known private key"
        text: |
          Import Foundry's account-0 private key under a passphrase. The module
          returns only the **address** — the key stays inside the scrypt vault.
        run: "./logos/bin/logoscore call keystore_custodian import_key ac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80 pw"
        code_block: "logoscore call keystore_custodian import_key <privkey> pw"
        expect_contains:
          - "f39Fd6e51aad88F6F4ce6aB8827279cffFb92266"
      - title: "List accounts"
        run: "./logos/bin/logoscore call keystore_module list_accounts"
        code_block: "logoscore call keystore_module list_accounts"
        expect_contains:
          - "f39Fd6e51aad88F6F4ce6aB8827279cffFb92266"
      - title: "A key no recovery phrase covers needs an acknowledgement"
        text: |
          `create_unrelated_account` is the **one** way to obtain a key generated from
          randomness rather than derived from a phrase. There used to be a second,
          `new_account`, which minted one silently on a keystore that looked empty — whether
          that was safe rested on a directory scan being complete, and "is there live key
          material anywhere under this store" is not decidable by inspection.

          The acknowledgement is. Note who is refused here: the **custodian**, the one caller
          Tier D admits. The acknowledgement is a property of the call, not of the caller, so
          there is no identity that skips it.
        run: "./logos/bin/logoscore call keystore_custodian create pw false"
        code_block: "logoscore call keystore_custodian create pw false"
        expect_contains:
          - "recovery phrase will not restore"
      - title: "…and with it, the key lands"
        text: |
          Same caller, same password, one argument different. The refusal above is not a
          rate limit or a retry — the key does not exist until it is acknowledged.
        run: "./logos/bin/logoscore call keystore_custodian create pw true"
        code_block: "logoscore call keystore_custodian create pw true"
        expect_contains:
          - "random"
      - title: "A file the keystore did not write is reported, not a wedge"
        text: |
          Drop a `.DS_Store` into the keystore directory. The scan cannot explain it, and it
          says so — but it no longer refuses anything: listing, creating and sweeping all
          keep working, and the reported path is removable by name. When the scan was the
          safety gate this was a brick, because anything it could not name might have been a
          hidden derivation key.
        run: |
          d=$(find . -type d -path '*module_data/keystore_module/*' | head -1)
          printf 'x' > "$d/keystore/.DS_Store"
          ./logos/bin/logoscore call keystore_module list_accounts
          ./logos/bin/logoscore call keystore_custodian create pw true
          ./logos/bin/logoscore call keystore_custodian settle
          ./logos/bin/logoscore call keystore_custodian remove .DS_Store
        code_block: |
          echo x > <module-data>/keystore/.DS_Store
          logoscore call keystore_module list_accounts
          logoscore call keystore_custodian remove .DS_Store
        expect_contains:
          - "f39Fd6e51aad88F6F4ce6aB8827279cffFb92266"
          - ".DS_Store"
          - '"removed":true'
      - title: "Name a wallet — and prove you hold one of its accounts"
        text: |
          A derivation group has no name of its own to fall back on: what a UI shows is its
          first account's address, and deleting that account moves it. `set_group_label`
          gives it one. It is Tier D, so the CLI is refused and the custodian is not.

          Tier D is not the whole story here. A name is the one string in this keystore that
          an attacker chooses and a human reads — it is rendered *in place of* an address —
          so setting one now also needs the vault password of **one of the wallet's own
          accounts**. Holding an account is precisely the claim "this wallet is mine". The
          *group* password is not accepted here: it proves you can make accounts, not that
          you own the ones the header speaks for. Where the wallet has **no** accounts and
          only a key, it is the credential — see the next step.

          `get_group_labels` is **ungated**, and answers from its own document rather than
          from the group record — so the name outlives the record and the key it belonged to,
          which is exactly the row a UI has to name while asking whether to delete it. Two
          wallets may carry one name: telling them apart is the reader's job, and refusing
          the write would only stop it showing what the user actually did.
        run: |
          r=$(./logos/bin/logoscore call keystore_custodian import_phrase 'abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about' gp pw2 0)
          g=$(echo "$r" | grep -o 'g_[0-9a-f]\{32\}' | head -1)
          a=$(echo "$r" | grep -o '0x[0-9a-fA-F]\{40\}' | head -1); a=${a#0x}
          ./logos/bin/logoscore call keystore_module set_group_label "{\"group\":\"$g\",\"label\":\"Cold storage\"}"
          ./logos/bin/logoscore call keystore_custodian name_wallet "$g" "Cold storage" "$a" wrong-password
          ./logos/bin/logoscore call keystore_custodian name_wallet "$g" "Cold storage" "" ""
          ./logos/bin/logoscore call keystore_custodian name_wallet "$g" "Cold storage" "$a" pw2
          ./logos/bin/logoscore call keystore_module get_group_labels
        code_block: |
          logoscore call keystore_module set_group_label '{"group":"<g>","label":"Cold storage"}'   # refused: Tier D
          logoscore call keystore_custodian name_wallet <g> "Cold storage" <address> wrong-password # refused: password
          logoscore call keystore_custodian name_wallet <g> "Cold storage" "" ""                    # refused: no account named
          logoscore call keystore_custodian name_wallet <g> "Cold storage" <address> pw2            # written
          logoscore call keystore_module get_group_labels
        expect_contains:
          - "not authorized"
          - "the password for this account is not correct"
          - "needs the password of one of them"
          - "Cold storage"
      - title: "A wallet that can still mint accounts is named by its derivation key"
        text: |
          "No accounts" is not "holds nothing". A wallet that keeps a derivation key and has
          no accounts *yet* will have them, and they will be shown under whatever name is on
          the header — so a name written here with no proof comes to stand over a real
          account the moment one is derived. The exemption is therefore for a wallet that
          holds **nothing**: no accounts *and* no key at either path, which is the same
          precondition `remove_group` refuses on.

          With a key and no accounts there is no account to hold, so what proves the name is
          the thing that will mint them: the **derivation key's** own password. Clearing a
          name still asks for nothing, and `forget_derivation` still takes no password — a
          key you cannot open stays deletable.
        run: |
          r=$(./logos/bin/logoscore call keystore_custodian import_phrase 'abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about' gp4 pw4 5)
          g=$(echo "$r" | grep -o 'g_[0-9a-f]\{32\}' | head -1)
          a=$(echo "$r" | grep -o '0x[0-9a-fA-F]\{40\}' | head -1); a=${a#0x}
          ./logos/bin/logoscore call keystore_custodian delete "$a" pw4
          ./logos/bin/logoscore call keystore_custodian name_wallet "$g" "Cold storage" "" ""
          ./logos/bin/logoscore call keystore_custodian name_wallet "$g" "Cold storage" "" wrong-password
          ./logos/bin/logoscore call keystore_custodian name_wallet "$g" "Cold storage" "" gp4
          ./logos/bin/logoscore call keystore_custodian derive "$g" gp4 pw4
          ./logos/bin/logoscore call keystore_module list_groups
        code_block: |
          logoscore call keystore_custodian delete <address> pw4          # the wallet now has no accounts
          logoscore call keystore_custodian name_wallet <g> "Cold storage" "" ""              # refused: needs the key
          logoscore call keystore_custodian name_wallet <g> "Cold storage" "" wrong-password  # refused: password
          logoscore call keystore_custodian name_wallet <g> "Cold storage" "" gp4             # written
          logoscore call keystore_custodian derive <g> gp4 pw4            # and now the name stands over an account
          logoscore call keystore_module list_groups
        expect_contains:
          - "keeps a derivation key needs that key's password"
          - "the password for this wallet's derivation key is not correct"
          - "Cold storage"
      - title: "Naming an account proves you hold that account"
        text: |
          The same rule, one level down, and this is the sharper case: `set_label` writes the
          string a wallet renders *instead of* an address in its account picker. Renaming
          "Savings" to something a user would fund is exactly the attack, so setting a name
          needs that account's own vault password.

          **Clearing a name needs nothing.** It can only move the display back toward the raw
          address, which is ground truth — it cannot impersonate anyone — and it is the one
          way to strip a stale name off an account whose password is lost. Without that
          exemption we would rebuild the wedge `forget_derivation` exists to avoid: a thing
          you cannot open and therefore cannot manage.

          The account below is Foundry's account 0, imported near the top of this run under
          the password `pw`.
        run: |
          ./logos/bin/logoscore call keystore_custodian name_account f39Fd6e51aad88F6F4ce6aB8827279cffFb92266 Treasury wrong-password
          ./logos/bin/logoscore call keystore_module get_labels
          ./logos/bin/logoscore call keystore_custodian name_account f39Fd6e51aad88F6F4ce6aB8827279cffFb92266 Treasury pw
          ./logos/bin/logoscore call keystore_module get_labels
          ./logos/bin/logoscore call keystore_custodian name_account f39Fd6e51aad88F6F4ce6aB8827279cffFb92266 "  " nonsense
          ./logos/bin/logoscore call keystore_module get_labels
        code_block: |
          logoscore call keystore_custodian name_account <address> Treasury wrong-password  # refused
          logoscore call keystore_custodian name_account <address> Treasury pw              # written
          logoscore call keystore_custodian name_account <address> "  " nonsense            # cleared, no password
          logoscore call keystore_module get_labels
        expect_contains:
          - "the password for this account is not correct"
          - "Treasury"
      - title: "A wallet with nothing left in it can finally be removed"
        text: |
          A wallet is up to four things: a record in `groups.json`, a name in
          `group-labels.json`, a derivation key, and its accounts. `forget_derivation`
          removes the **key** and reports not-found when there is none — so a wallet that is
          not derivable and holds no accounts had only a record, and nothing in this module
          could take its row off the screen. `remove_group` is that method.

          It removes the record and the name, and it **refuses while the wallet still holds
          anything** — a derivation key (live or staged) or an account. So it is never a
          second door to deleting a key, and because "holds nothing" is the precondition it
          needs no password: there is nothing signable left for one to protect. The ladder
          below is the whole cost, and it is the correct cost — every rung that is refused is
          refused because a spendable key is still under that row.
        run: |
          r=$(./logos/bin/logoscore call keystore_custodian import_phrase 'abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about' gp2 pw3 1)
          g=$(echo "$r" | grep -o 'g_[0-9a-f]\{32\}' | head -1)
          a=$(echo "$r" | grep -o '0x[0-9a-fA-F]\{40\}' | head -1); a=${a#0x}
          ./logos/bin/logoscore call keystore_custodian name_wallet "$g" "Old phone" "$a" pw3
          ./logos/bin/logoscore call keystore_module remove_group "{\"group\":\"$g\"}"
          ./logos/bin/logoscore call keystore_custodian remove_wallet "$g"
          ./logos/bin/logoscore call keystore_custodian forget "$g"
          ./logos/bin/logoscore call keystore_custodian remove_wallet "$g"
          ./logos/bin/logoscore call keystore_custodian delete "$a" pw3
          ./logos/bin/logoscore call keystore_custodian remove_wallet "$g"
          ./logos/bin/logoscore call keystore_module list_groups
        code_block: |
          logoscore call keystore_custodian name_wallet <g> "Old phone" <address> pw3
          logoscore call keystore_module remove_group '{"group":"<g>"}'  # refused: Tier D
          logoscore call keystore_custodian remove_wallet <g>            # refused: it still keeps a key
          logoscore call keystore_custodian forget <g>
          logoscore call keystore_custodian remove_wallet <g>            # refused: it still holds an account
          logoscore call keystore_custodian delete <address> pw3
          logoscore call keystore_custodian remove_wallet <g>            # the row goes
          logoscore call keystore_module list_groups
        expect_contains:
          - "not authorized"
          - "still keeps a derivation key"
          - "still holds 1 account(s)"
          - "recordRemoved"
          - "nameRemoved"
      - title: "Ask the module who it thinks is calling"
        text: |
          The CLI presents a host bootstrap anchor, so the keystore names it
          `host` — honestly, and without inventing a module name. `core` and
          `capability_module` share one token value under two keys, so an anchor
          cannot be attributed to any particular party. That is the whole reason
          the next two steps refuse: the caller is named, and is not admitted.
        run: "./logos/bin/logoscore call keystore_module caller_identity"
        code_block: "logoscore call keystore_module caller_identity"
        expect_contains:
          - "host"
      - title: "Request a signature from the CLI — refused"
        text: |
          `request_approval` is Tier B: any **named module** may ask for a
          signature. The CLI is not a named module, so it cannot even ask.
        run: "./logos/bin/logoscore call keystore_module request_approval '{\"address\":\"0x0000000000000000000000000000000000000001\",\"purpose\":\"doc-test\",\"legs\":[{\"kind\":\"message\",\"text\":\"hello-logos\"}]}'"
        code_block: "logoscore call keystore_module request_approval '{...intent...}'"
        expect_contains:
          - "not authorized"
      - title: "Approve a signature from the CLI — refused"
        text: |
          `approve` is Tier A: **only** the configured approver (`signer_ui`) may
          approve, and it must be a human doing it. There is no flag, token or
          argument that makes this succeed from a shell — which is the property
          this module exists to provide.
        run: "./logos/bin/logoscore call keystore_module pending"
        code_block: "logoscore call keystore_module pending"
        expect_contains:
          - "not authorized"
      - title: "Stop the daemon"
        run: "./logos/bin/logoscore stop"
        code_block: "logoscore stop"
      - run: "sleep 2"
      - title: "Confirm the daemon has stopped"
        run: "./logos/bin/logoscore status || true"
        code_block: "logoscore status"
        expect_contains:
          - '"status":"not_running"'
