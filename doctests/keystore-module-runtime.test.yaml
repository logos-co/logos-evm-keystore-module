name: "Running the Keystore Module Against logoscore"
output: keystore-module-runtime.md
release: ""

intro: |
  `logos-evm-keystore-module` is the keystore for the Logos multi-chain EVM
  wallet: scrypt-encrypted vaults, BIP39/BIP32 HD derivation, and secp256k1
  signing, built on [`alloy`](https://github.com/alloy-rs/alloy) and
  [`eth-keystore`](https://crates.io/crates/eth-keystore). It does **no
  networking** and private keys never cross the module boundary.

  This doc-test exercises the module end-to-end through the headless `logoscore`
  runtime — every step is **offline and deterministic**, so it needs no network
  and reproduces in CI:

  1. Build `logoscore` and `lgpm` from their published flakes.
  2. Build this module's installable `.lgx` from its `#lgx` output.
  3. Install it into a `./modules` directory with `lgpm`.
  4. Start a `logoscore` daemon, load `keystore_module`, and drive it: generate a
     mnemonic, import a known private key, unlock the account, and produce a real
     EIP-191 signature and a signed EIP-1559 transaction.

what_you_build: "This `keystore_module`, packaged as `.lgx`, installed with `lgpm`, and called through a `logoscore` daemon."

what_you_learn:
  - How a Rust (rust-first cdylib) Logos module is packaged as an installable `.lgx`
  - How to install it with `lgpm` and load it into a `logoscore` daemon
  - How to import a key, unlock it, and sign a message and a transaction over IPC
  - How the keystore keeps private keys inside the module (only addresses and signed payloads come out)

prerequisites:
  - |
    **Nix** with flakes enabled. Install from [nixos.org](https://nixos.org/download.html), then enable flakes:

    ```bash
    mkdir -p ~/.config/nix
    echo 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf
    ```

    Verify: `nix flake --help >/dev/null 2>&1 && echo "Flakes enabled"`
  - "**A Linux or macOS machine.** Everything here is offline."

sections:
  - title: "Build logoscore and lgpm"
    step: true
    text: |
      `logoscore` is the headless frontend for `logos-liblogos` (it brings in the
      whole module-runtime stack), and `lgpm` installs `.lgx` packages into a
      modules directory.
    steps:
      - title: "Build logoscore"
        run: "nix build 'github:logos-co/logos-logoscore-cli#cli' --out-link ./logos"
        check_file: "logos/bin/logoscore"
      - title: "Build lgpm"
        run: "nix build 'github:logos-co/logos-package-manager#cli' -o lgpm"
        check_file: "lgpm/bin/lgpm"

  - title: "Build and install the keystore module"
    step: true
    text: |
      Build this module's `.lgx` from its flake's `#lgx` output and install it
      into a local `./modules` directory. The bundled `capability_module` (shipped
      with `logoscore`) handles the load-time auth handshake, so seed it first.
    steps:
      - title: "Build the module's .lgx"
        run: "nix build 'github:logos-co/logos-evm-keystore-module{release}#lgx' --no-write-lock-file -o keystore-lgx"
        code_block: |
          # From inside the clone this is simply: nix build '.#lgx'
          nix build 'github:logos-co/logos-evm-keystore-module{release}#lgx' -o keystore-lgx
        extra_run:
          run: "ls keystore-lgx/*.lgx"
      - title: "Seed the capability module"
        run: |
          mkdir -p modules
          cp -RL ./logos/modules/. ./modules/
        check_file: "modules/capability_module/manifest.json"
      - title: "Install the .lgx with lgpm"
        run: "./lgpm/bin/lgpm --modules-dir ./modules --allow-unsigned install --file keystore-lgx/*.lgx"
        expect_contains:
          - "Installed to:"
      - title: "Confirm the install"
        run: "./lgpm/bin/lgpm --modules-dir ./modules list"
        expect_contains:
          - "keystore_module"
        check_file: "modules/keystore_module/manifest.json"

  - title: "Run the daemon and drive the keystore"
    step: true
    text: |
      Start `logoscore` pointed at `./modules`, load the module, and call it. We
      use Foundry's well-known test key (account 0,
      `0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266`). Note that `logoscore`'s `call`
      auto-types a `0x…` argument as a number, so addresses are passed as **bare
      hex** — the keystore accepts either form.
    steps:
      - title: "Write an unsigned transaction"
        file:
          path: tx.json
          content: |
            {
              "to": "0x70997970C51812dc3A010C7d01b50e0d17dc79C8",
              "value": "0xde0b6b3a7640000",
              "nonce": "0x0",
              "gas_limit": "0x5208",
              "max_fee_per_gas": "0x77359400",
              "max_priority_fee_per_gas": "0x3b9aca00",
              "fee_mode": "eip1559"
            }
      - title: "Start the daemon"
        run: "sh -c './logos/bin/logoscore -D -m ./modules > logs.txt 2>&1 &'"
        code_block: "logoscore -D -m ./modules > logs.txt &"
      - run: "sleep 3"
      - title: "Load the module"
        run: "./logos/bin/logoscore load-module keystore_module"
        code_block: "logoscore load-module keystore_module"
        expect_contains:
          - "keystore_module"
      - title: "Introspect the module"
        run: "./logos/bin/logoscore module-info keystore_module"
        code_block: "logoscore module-info keystore_module"
        expect_contains:
          - "sign_transaction"
          - "sign_message"
      - title: "Generate a BIP-39 mnemonic"
        run: "./logos/bin/logoscore call keystore_module create_mnemonic 12"
        code_block: "logoscore call keystore_module create_mnemonic 12"
        expect_contains:
          - "phrase"
      - title: "Import a known private key"
        text: |
          Import Foundry's account-0 private key under a passphrase. The module
          returns only the **address** — the key stays inside the scrypt vault.
        run: "./logos/bin/logoscore call keystore_module import_private_key ac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80 pw"
        code_block: "logoscore call keystore_module import_private_key <privkey> pw"
        expect_contains:
          - "f39Fd6e51aad88F6F4ce6aB8827279cffFb92266"
      - title: "List accounts"
        run: "./logos/bin/logoscore call keystore_module list_accounts"
        code_block: "logoscore call keystore_module list_accounts"
        expect_contains:
          - "f39Fd6e51aad88F6F4ce6aB8827279cffFb92266"
      - title: "Unlock the account"
        run: "./logos/bin/logoscore call keystore_module unlock f39fd6e51aad88f6f4ce6ab8827279cfffb92266 pw"
        code_block: "logoscore call keystore_module unlock <address> pw"
        expect_contains:
          - "true"
      - title: "Sign a message (EIP-191)"
        run: "./logos/bin/logoscore call keystore_module sign_message f39fd6e51aad88f6f4ce6ab8827279cfffb92266 hello-logos"
        code_block: "logoscore call keystore_module sign_message <address> hello-logos"
        expect_contains:
          - "signature"
          - "0x"
      - title: "Sign an EIP-1559 transaction"
        text: |
          `sign_transaction` signs the unsigned tx in `tx.json` for chain 1 and
          returns the raw, broadcast-ready signed transaction (a `0x02…` typed
          envelope).
        run: "./logos/bin/logoscore call keystore_module sign_transaction f39fd6e51aad88f6f4ce6ab8827279cfffb92266 @tx.json 1"
        code_block: "logoscore call keystore_module sign_transaction <address> @tx.json 1"
        expect_contains:
          - "raw"
          - "0x02"
      - title: "Stop the daemon"
        run: "./logos/bin/logoscore stop"
        code_block: "logoscore stop"
      - run: "sleep 2"
      - title: "Confirm the daemon has stopped"
        run: "./logos/bin/logoscore status || true"
        code_block: "logoscore status"
        expect_contains:
          - '"status":"not_running"'
